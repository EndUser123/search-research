# gitingest config — list of GitHub repos to ingest into NotebookLM
#
# notebooklm_id: target NotebookLM notebook ID (from the notebook URL)
# repos:
#   - url: "https://github.com/owner/repo"
#     path: ""          # optional: sparse checkout path (empty = full repo)
#     branch: "main"    # optional: defaults to "main"
#     skip: false       # optional: set true to skip this repo

notebooklm_id: "bcd576b2-83e8-4732-b42c-4efccc9c5d57"
repos:
  - url: "https://github.com/siy/vibe-ensemble-mcp"
    branch: "main"
    path: ""
    skip: false
