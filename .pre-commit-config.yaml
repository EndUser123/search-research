# Pre-commit hooks for security and code quality
# SECURITY: detect-secrets WILL BLOCK commits with API keys/secrets
# OTHER HOOKS: Auto-fixable linting that never blocks

repos:
  # CRITICAL: Secret detection (BLOCKS commits to prevent API key exposure)
  # Added 2026-03-14 after security incident
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: |
          (?x)^(
            package\.lock\.json|
            poetry\.lock|
            Pipfile\.lock|
            .+\.venv/.*|
            .+node_modules/.*|
            .+\.pnpm-store/.*|
            .+litellm_venv/.*|
            .+\(vendor\|dist\|build\)/
          )

  # Ruff - Fast Python linter with auto-fix (never blocks)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-zero]   # Fix what it can, never fail
      - id: ruff-format               # Format code, never fail

  # pyupgrade - Modernize Python syntax (auto-fixes, never blocks)
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.0
    hooks:
      - id: pyupgrade
        args: [--py311-plus, --keep-runtime-typing]
        types: [python]

  # File cleanup hooks (modify files, never block)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace    # Auto-remove trailing whitespace
      - id: end-of-file-fixer      # Auto-add newline at EOF

# EXCLUDED (would block commits on issues):
# - mypy: Type errors block commits
# - bandit: Security findings block commits
# - check-yaml: Syntax errors block commits
# - check-merge-conflict: Conflict markers block commits
# - debug-statements: Debug statements block commits
# - check-added-large-files: Large files block commits
