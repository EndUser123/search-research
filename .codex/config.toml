[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
PYTHONPATH = "P:/.claude/hooks/__lib"
TDD_AUTOSCAFFOLD = "0"
TDD_BYPASS = "0"
CLAUDE_CODE_ENABLE_AWAY_SUMMARY = "true"
SENTENCE_TRANSFORMERS_HOME = 'P:\.model_cache'
HF_HOME = 'P:\.model_cache'
CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS = "1"
CKS_INTEGRATION_ENABLED = "true"
CLAUDE_CODE_TASK_LIST_ID = "project-main-tasks"
CC_DIAGNOSTICS_DIR = "P:/.claude/hooks/logs/diagnostics"
CSF_STATE_DIR = "P:/.claude/state"
CSF_HOOK_DEBUG = "0"
SESSION_REVERSION_INPROCESS = "1"
SKILL_ENFORCEMENT_INPROCESS = "1"
EXEC_ORCHESTRATOR_INPROCESS = "1"
TEST_ASSUMPTION_AUDIT_METHOD = "loose"
OBLIGATION_TTL_SECONDS = "600"
INTEGRATION_VERIFIER_ENABLED = "true"
INTEGRATION_VERIFIER_MODE = "warn"
ASSUMPTION_AUDIT_V2_ENABLED = "true"
CLAIM_COVERAGE_THRESHOLD = "0.3"
UNIFIED_CLAIM_VERIFIER_ENABLED = "true"
CLAIM_VERIFIER_SMOKE_ENABLED = "true"
MULTI_AGENT_ENABLED = "true"
SDLC_MULTI_LLM = "1"
ENFORCE_SKILL_FIRST_PRETOOLUSE = "true"
ENFORCE_SKILL_FIRST_STOP_FALLBACK = "true"
SKILL_FIRST_MODE = "hard_block"
SKILL_FIRST_LOGGING_ENABLED = "true"
STRAWBERRY_VALIDATOR_VERBOSE = "false"
STOP_CROSS_VALIDATOR_ENABLED = "true"
STOP_CROSS_VALIDATOR_MODE = "block"
CITED_CONTENT_GUARD_ENABLED = "true"
CITED_CONTENT_GUARD_MODE = "block"
OVERCONFIDENCE_DETECTOR_ENABLED = "true"
UNVERIFIED_STANCE_ENABLED = "true"
UNVERIFIED_STANCE_MODE = "warn"
DIAGNOSTIC_ANALYSIS_QUALITY_GATE_ENABLED = "true"
DIAGNOSTIC_ANALYSIS_QUALITY_GATE_MODE = "block"
HOOK_IMPORT_HEALTH_ENABLED = "true"
HOOK_IMPORT_HEALTH_VERBOSE = "false"
DEPENDENCY_VERIFICATION_ENABLED = "true"
INVESTIGATION_LOOP_ADVISORY_MODE = "true"
BREADCRUMB_VERIFIER_ENABLED = "true"
BREADCRUMB_VERIFIER_MODE = "block"
SKILL_PATTERN_ENFORCEMENT_ENABLED = "true"
SKILL_INTENT_DAEMON_ENABLED = "true"
FIRST_TOOL_COHERENCE_ENABLED = "true"
CSF_INVESTIGATION_GATE = "true"
REPO_VISIBILITY_GUARD_ENABLED = "true"
COMPARATIVE_CLAIM_GUARD_ENABLED = "true"
COMPARATIVE_CLAIM_GUARD_SCOPE = "fresh_session"
COMPARATIVE_CLAIM_GUARD_TTL_SECONDS = "7200"
DEPENDENCY_CHAIN_GUARD_ENABLED = "true"
CONSULTATION_LOOP_INTERRUPT_ENABLED = "true"
CONTEXT_SUFFICIENCY_GATE_ENABLED = "true"
SKILL_QUESTION_GATE_ENABLED = "true"
STOP_QUESTION_MARKER_ENABLED = "true"
CORRECTION_GATE_ENABLED = "true"
CORRECTION_GATE_MODE = "block"
DRIFT_SENTINEL_ENABLED = "true"
DRIFT_SENTINEL_MODE = "block"
STEP_HEADER_VERIFIER_MODE = "block"
FILE_INVALIDATION_TRACKER_ENABLED = "true"
DEPENDS_ON_SKILLS_GATE_ENABLED = "true"
AGENT_CONTRACT_VALIDATOR_ENABLED = "true"
CLAUDE_PROJECT_DIR = "P:/"
EPISTEMIC_CONTRACT_MODE = "warn"
EPISTEMIC_CAUSAL_MODE = "warn"
EPISTEMIC_COMPARATIVE_MODE = "warn"
STOP_TELEMETRY = "1"
ANTI_DODGE_JUDGE_ENABLED = "true"
DELEGATION_GATE_ENABLED = "false"
VERIDICAL_GATE_ENABLED = "true"
CKS_KNOWLEDGE_SEMANTIC = "false"

[mcp_servers.reddit]
command = "npx"
args = [
    "-y",
    "reddit-mcp-buddy",
]
