# Role Registry for Persistent Learning Agent Ecosystem
# This registry tracks all available expert roles and their configurations

registry_version: "1.0.0"
last_updated: "2025-12-21"

available_roles:
  backend_expert:
    definition_file: "backend_expert.yaml"
    category: "development"
    priority: 1
    status: "active"
    capabilities:
      primary: ["api_development", "database_design", "system_architecture"]
      secondary: ["performance_optimization", "security_implementation"]
    collaboration_matrix:
      frontend_expert: "high"      # API contracts and data structures
      testing_expert: "high"       # Backend testing strategy
      infrastructure_expert: "medium" # Deployment and scaling

  frontend_expert:
    definition_file: "frontend_expert.yaml"
    category: "development"
    priority: 1
    status: "active"
    capabilities:
      primary: ["ui_development", "ux_design", "frontend_performance"]
      secondary: ["accessibility", "responsive_design"]
    collaboration_matrix:
      backend_expert: "high"       # API integration
      testing_expert: "high"       # Frontend testing strategies
      infrastructure_expert: "medium" # CDN and static assets

  testing_expert:
    definition_file: "testing_expert.yaml"
    category: "quality_assurance"
    priority: 1
    status: "active"
    capabilities:
      primary: ["test_automation", "quality_assurance", "performance_testing"]
      secondary: ["security_testing", "test_strategy"]
    collaboration_matrix:
      backend_expert: "high"       # Backend testing
      frontend_expert: "high"      # E2E testing coordination
      infrastructure_expert: "high" # Performance testing and environments

  infrastructure_expert:
    definition_file: "infrastructure_expert.yaml"
    category: "operations"
    priority: 1
    status: "active"
    capabilities:
      primary: ["devops", "security", "monitoring", "deployment"]
      secondary: ["cloud_management", "cost_optimization"]
    collaboration_matrix:
      backend_expert: "high"       # Backend deployment and scaling
      frontend_expert: "medium"    # CDN and static asset delivery
      testing_expert: "high"       # Test environment management

role_categories:
  development:
    description: "Roles focused on software development and implementation"
    roles: ["backend_expert", "frontend_expert"]

  quality_assurance:
    description: "Roles focused on testing and quality management"
    roles: ["testing_expert"]

  operations:
    description: "Roles focused on infrastructure and operations"
    roles: ["infrastructure_expert"]

task_role_mapping:
  # Backend tasks
  api_development: ["backend_expert"]
  database_design: ["backend_expert"]
  backend_architecture: ["backend_expert", "infrastructure_expert"]

  # Frontend tasks
  ui_implementation: ["frontend_expert"]
  ux_optimization: ["frontend_expert"]
  frontend_performance: ["frontend_expert", "infrastructure_expert"]

  # Testing tasks
  test_automation: ["testing_expert"]
  quality_assurance: ["testing_expert"]
  performance_testing: ["testing_expert", "infrastructure_expert"]
  security_testing: ["testing_expert", "infrastructure_expert"]

  # Infrastructure tasks
  deployment: ["infrastructure_expert", "backend_expert"]
  monitoring_setup: ["infrastructure_expert"]
  security_implementation: ["infrastructure_expert", "backend_expert"]
  devops_automation: ["infrastructure_expert"]

  # Full-stack tasks
  full_stack_development: ["backend_expert", "frontend_expert", "testing_expert"]
  application_lifecycle: ["backend_expert", "frontend_expert", "testing_expert", "infrastructure_expert"]

role_combinations:
  # Common role pairings for complex tasks
  full_stack_team:
    roles: ["backend_expert", "frontend_expert", "testing_expert"]
    use_cases: ["web_application_development", "api_integration", "feature_development"]

  devqa_team:
    roles: ["backend_expert", "testing_expert"]
    use_cases: ["backend_feature_development", "api_testing", "performance_optimization"]

  infrastructure_team:
    roles: ["infrastructure_expert", "testing_expert"]
    use_cases: ["deployment_automation", "performance_testing", "security_hardening"]

  complete_lifecycle_team:
    roles: ["backend_expert", "frontend_expert", "testing_expert", "infrastructure_expert"]
    use_cases: ["new_project_setup", "major_release", "system_overhaul"]

registry_metadata:
  schema_version: "1.0"
  supported_fields:
    - "role_name"
    - "description"
    - "core_competencies"
    - "technical_skills"
    - "protocol_steps"
    - "tool_assignments"
    - "prompt_templates"
    - "quality_standards"
    - "collaboration_patterns"
    - "decision_authority"
    - "learning_focus"
    - "specialization_areas"

  validation_rules:
    role_name: "required, unique, snake_case"
    description: "required, max 200 chars"
    core_competencies: "required, min 3 items"
    technical_skills: "required"
    protocol_steps: "required"
    tool_assignments: "required"
    quality_standards: "required"
    collaboration_patterns: "required"