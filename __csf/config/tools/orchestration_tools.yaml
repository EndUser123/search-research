# Orchestration Tools Configuration
# Tools available for workflow orchestration and planning

name: "orchestration_tools"
description: "CSF tools available for orchestration workflows"
version: "1.0.0"

# Tool definitions with path resolution
tools:
  research:
    name: "research"
    description: "Research and information gathering tool"
    category: "analysis"
    command_path: "P:/.claude/commands/research.md"
    implementation_path: "P:/__csf/commands/research"
    capabilities:
      - "information_gathering"
      - "source_analysis"
      - "knowledge_synthesis"
    config_schema:
      depth:
        type: "string"
        values: ["quick", "medium", "comprehensive"]
        default: "medium"
      sources:
        type: "array"
        values: ["internal", "external", "both"]
        default: ["both"]
    timeout: 600
    parallel_capable: true

  architect-analyst:
    name: "architect-analyst"
    description: "Architectural analysis and design tool"
    category: "analysis"
    command_path: "P:/.claude/commands/architect-analyst.md"
    implementation_path: "P:/__csf/commands/architect-analyst"
    capabilities:
      - "architecture_analysis"
      - "design_validation"
      - "system_assessment"
    config_schema:
      analysis_type:
        type: "string"
        values: ["comprehensive", "focused", "validation"]
        default: "comprehensive"
      include_risks:
        type: "boolean"
        default: true
    timeout: 900
    parallel_capable: true

  slc2:
    name: "slc2"
    description: "System Life Cycle and Complexity tool"
    category: "analysis"
    command_path: "P:/.claude/commands/slc2.md"
    implementation_path: "P:/__csf/commands/slc2"
    capabilities:
      - "lifecycle_analysis"
      - "complexity_assessment"
      - "system_modeling"
    config_schema:
      model_type:
        type: "string"
        values: ["standard", "enhanced", "custom"]
        default: "standard"
      complexity_factors:
        type: "boolean"
        default: true
    timeout: 450
    parallel_capable: true

  planning:
    name: "planning"
    description: "Evidence-based planning and task decomposition"
    category: "planning"
    implementation_path: "P:/__csf/modules/planning"
    capabilities:
      - "task_decomposition"
      - "evidence_based_planning"
      - "resource_planning"
    config_schema:
      methodology:
        type: "string"
        values: ["evidence-based", "agile", "waterfall"]
        default: "evidence-based"
      include_timeline:
        type: "boolean"
        default: true
      resource_estimation:
        type: "boolean"
        default: true
    timeout: 1200
    parallel_capable: false

  security-specialist:
    name: "security-specialist"
    description: "Security analysis and compliance validation"
    category: "security"
    command_path: "P:/.claude/commands/security-specialist.md"
    implementation_path: "P:/__csf/commands/security"
    capabilities:
      - "security_analysis"
      - "vulnerability_assessment"
      - "compliance_validation"
    config_schema:
      assessment_type:
        type: "string"
        values: ["comprehensive", "focused", "compliance_only"]
        default: "comprehensive"
      compliance_checks:
        type: "boolean"
        default: true
    timeout: 900
    parallel_capable: true

  performance-specialist:
    name: "performance-specialist"
    description: "Performance analysis and optimization"
    category: "performance"
    command_path: "P:/.claude/commands/performance-specialist.md"
    implementation_path: "P:/__csf/commands/performance"
    capabilities:
      - "performance_analysis"
      - "bottleneck_detection"
      - "optimization_recommendations"
    config_schema:
      include_benchmarks:
        type: "boolean"
        default: true
      scalability_factors:
        type: "boolean"
        default: true
    timeout: 600
    parallel_capable: true

# Tool categories
categories:
  analysis:
    description: "Analysis and research tools"
    tools: ["research", "architect-analyst", "slc2"]
  planning:
    description: "Planning and coordination tools"
    tools: ["planning"]
  security:
    description: "Security and compliance tools"
    tools: ["security-specialist"]
  performance:
    description: "Performance and optimization tools"
    tools: ["performance-specialist"]

# Default workflows for common use cases
default_workflows:
  comprehensive_planning:
    name: "comprehensive_planning"
    description: "Full planning workflow with research and analysis"
    sequence: ["research", "architect-analyst", "planning"]
    mode: "synchronous"
    timeout: 3600

  quick_analysis:
    name: "quick_analysis"
    description: "Rapid analysis for quick decisions"
    sequence: ["research", "architect-analyst"]
    mode: "synchronous"
    timeout: 1800

  parallel_assessment:
    name: "parallel_assessment"
    description: "Parallel analysis for comprehensive assessment"
    sequence: ["research", "architect-analyst", "security-specialist", "performance-specialist"]
    mode: "parallel"
    timeout: 2400

# Path resolution rules
path_resolution:
  command_paths:
    - "P:/.claude/commands"
    - "P:/__csf/commands"
  implementation_paths:
    - "P:/__csf/modules"
    - "P:/__csf/commands"
    - "P:/__csf/src/modules"

# Tool availability rules
availability_rules:
  require_command_path: true
  require_implementation_path: false  # Some tools might be built-in
  fallback_to_alternative: true
  validate_paths: true
