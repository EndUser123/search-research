# Factual Claims Contract
# Version: 1.0
# Description: Ensures factual claims about code, tests, and files are verified

name: "Factual Claims Contract"
version: "1.0"
applies_to:
  task_types: [code_read, code_explanation, investigation, bug_fix]

validators:
  factual_claims:
    class: FactualClaimValidator
    enabled: true

    rules:
      - id: fc_001
        description: "Claims about code existence must be backed by tool reads"
        pattern: "function_exists|file_exists|test_exists"
        severity: "warning"

      - id: fc_002
        description: "Claims about function behavior must cite code or tests"
        pattern: "behavior|returns|outputs"
        severity: "warning"

      - id: fc_003
        description: "Unconditional claims (all/every/never) require extra scrutiny"
        pattern: "unconditional"
        severity: "warning"

      - id: fc_004
        description: "Claims about call graphs must use verification tools"
        pattern: "call_graph"
        severity: "warning"

    evidence_sources:
      - tool_logs: [Read, Grep, Glob, find_symbol, find_referencing_symbols]
      - test_results: [pytest, cargo test, npm test, go test]
      - static_analysis: [mypy, pylint, eslint, rustc]

    suggested_tools:
      function_exists: "find_referencing_symbols or Grep"
      test_exists: "Glob for test files (test_*.py, *_test.py, *.test.ts)"
      file_exists: "Glob or ls"
      call_graph: "find_referencing_symbols"
      behavior: "Read the function code"

on_fail:
  severity: "warning"
  action: "rewrite"
  add_suggestion: true

prompt_guidance: |
  When making factual claims about code:
  - Verify claims using appropriate tools before stating them
  - Use "Let me verify..." or "Let me check..." when uncertain
  - For function calls/references: use find_referencing_symbols
  - For test coverage: check with Glob or run test suite
  - For file structure: use Glob or ls
  - Avoid unconditional claims like "all functions..." or "never..."
