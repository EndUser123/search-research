# Logical Consequences Contract
# Version: 1.0
# Description: Ensures claims about code behavior are traceable and valid

name: "Logical Consequences Contract"
version: "1.0"
applies_to:
  task_types: [code_read, code_explanation, bug_fix, investigation]

validators:
  logical_consequences:
    class: LogicalConsequenceValidator
    enabled: true

    rules:
      - id: lc_001
        description: "Claims about code behavior must trace to actual code"
        pattern: "behavior|consequence|result"
        severity: "error"

      - id: lc_002
        description: "Inference chains must be explicit"
        pattern: "therefore|thus|consequently"
        severity: "warning"

      - id: lc_003
        description: "Conditional claims must reference the actual condition"
        pattern: "if|when|given"
        severity: "error"

    allows_inference: true
    requires_code_trace: true
    allow_tool_based_deduction: true

    valid_inference_sources:
      - direct_code_reading: "Read tool output"
      - control_flow_analysis: "If/else, loop structures"
      - data_flow_analysis: "Variable assignments and usage"
      - type_system: "Type annotations and constraints"

on_fail:
  severity: "error"
  action: "rewrite"
  require_verification: true

prompt_guidance: |
  When making claims about code behavior:
  - Base claims on actual code structure, not assumptions
  - Trace inference steps explicitly: "Since X uses Y, then..."
  - For conditional behavior, cite the actual condition: "When `timeout` is None..."
  - Use tool reads to verify behavior claims
  - Distinguish between "code does X" (observed) vs "code would do X" (inferred)

  Examples:
  - Good: "Since the function catches ValueError (line 45), it will handle invalid inputs."
  - Good: "Reading the code, this function returns None when the input is empty."
  - Avoid: "This function will handle errors" (without showing error handling)
