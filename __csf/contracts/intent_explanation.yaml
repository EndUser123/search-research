# Intent Explanation Contract
# Version: 1.0
# Description: Ensures author intent and design rationale claims are evidenced or hedged

name: "Intent Explanation Contract"
version: "1.0"
applies_to:
  task_types: [code_read, code_explanation, refactor_design, investigation]

validators:
  intent_explanation:
    class: IntentExplanationValidator
    enabled: true

    rules:
      - id: ie_001
        description: "Author intent claims require evidence from comments/docs/issues"
        pattern: "intent|rationale|reason|purpose"
        severity: "warning"

      - id: ie_002
        description: "Without evidence, use hedging language (may, might, appears to)"
        pattern: "speculation"
        severity: "warning"

      - id: ie_003
        description: "Design rationale claims need citations or clear hedging"
        pattern: "design_choice|pattern_chosen"
        severity: "warning"

    evidence_sources:
      - comments: ["#", "//", "/*", "*", "<!--", "\"\"\""]
      - docs: ["README.md", "DESIGN.md", "ARCHITECTURE.md", "CONTRIBUTING.md", "docs/"]
      - issues: ["GitHub issues", "PR discussions", "commit messages"]
      - cks: ["Constitutional Knowledge System"]

    hedging_patterns:
      - "may"
      - "might"
      - "could"
      - "possibly"
      - "perhaps"
      - "appears to"
      - "suggests"
      - "indicates"
      - "potentially"
      - "conceivably"

    intent_patterns:
      - "the author (added|wrote|designed|created|implemented) .+ because"
      - "this (was|is) (added|written|designed|created|implemented) to"
      - "the (reason|purpose|intent) .+ (is|was)"
      - "this pattern (was|is) chosen (for|to|because)"

on_fail:
  severity: "warning"
  action: "rewrite"
  add_hedging: true
  require_citation: false  # Soft mode default

prompt_guidance: |
  When explaining author intent or design rationale:
  - Distinguish between observed facts and intent speculation
  - Cite evidence when available: "As the comment states..."
  - Use hedging when uncertain: "This may suggest..." or "The author might have..."
  - For design patterns: explain "This pattern is typically used for..." rather than "The author chose this because..."
  - Avoid definitive intent claims without supporting evidence

  Examples:
  - Good: "This error handling may suggest the author was concerned about edge cases."
  - Good: "According to the docstring, this function handles X."
  - Avoid: "The author added this because users forget to call cleanup." (unless documented)
