name: Task Execution Enhancements CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*' ]
    paths:
      - '.gittree/task-execution-enhancements/**'
      - '__csf.nip/**'
      - '.claude/**'
      - 'deployment-automation/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '.gittree/task-execution-enhancements/**'
      - '__csf.nip/**'
      - '.claude/**'
      - 'deployment-automation/**'
  release:
    types: [ published ]
  schedule:
    # Daily health check at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.10'
  UV_VERSION: 'latest'
  NODE_VERSION: '18'

jobs:
  # Stage 1: Code Quality and Security
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    outputs:
      quality-score: ${{ steps.quality-check.outputs.score }}
      security-scan: ${{ steps.security-scan.outputs.status }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for analysis

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Setup UV Package Manager
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache Dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install Dependencies
      run: |
        uv sync --dev

    - name: Linting with Ruff
      id: lint
      run: |
        uv run ruff check . --output-format=json > lint-report.json || true
        uv run ruff check . --output-format=github

    - name: Type Checking with MyPy
      run: |
        uv run mypy __csf.nip/src/ --junit-xml mypy-report.xml

    - name: Security Scanning with Bandit
      id: security-scan
      run: |
        uv run bandit -r __csf.nip/src/ -f json -o security-report.json || true
        uv run bandit -r __csf.nip/src/

    - name: Code Quality Score
      id: quality-check
      run: |
        # Calculate quality score based on linting and security
        LINT_ERRORS=$(cat lint-report.json | jq '.[].fixable | length' | awk '{sum+=$1} END {print sum+0}')
        SECURITY_ISSUES=$(cat security-report.json | jq '.results | length')

        # Simple scoring: 100 - (errors * 2) - (security * 5)
        SCORE=$((100 - (LINT_ERRORS * 2) - (SECURITY_ISSUES * 5)))
        if [ $SCORE -lt 0 ]; then SCORE=0; fi

        echo "score=$SCORE" >> $GITHUB_OUTPUT
        echo "Code Quality Score: $SCORE/100"

    - name: Upload Quality Reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: quality-reports
        path: |
          lint-report.json
          mypy-report.xml
          security-report.json
        retention-days: 30

  # Stage 2: Testing
  testing:
    name: Comprehensive Testing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install Dependencies
      run: |
        uv sync --dev

    - name: Run Unit Tests
      run: |
        uv run pytest __csf.nip/tests/ --junitxml=test-results.xml --cov=__csf.nip/src --cov-report=xml --cov-report=html

    - name: Run Integration Tests
      run: |
        uv run pytest tests/integration/ --junitxml=integration-results.xml -v

    - name: Test Session Management
      run: |
        cd .claude && python -m pytest hooks/test_*.py --junitxml=session-tests.xml

    - name: Performance Benchmarks
      run: |
        uv run python -m pytest tests/performance/ --benchmark-json=benchmark-results.json

    - name: Upload Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          test-results.xml
          integration-results.xml
          session-tests.xml
          benchmark-results.json
          htmlcov/
        retention-days: 30

  # Stage 3: Environment Validation
  environment-validation:
    name: Environment Validation
    runs-on: ${{ matrix.os }}
    needs: [code-quality, testing]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        environment: [development, staging, production]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Setup Environment
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Run Environment Setup
      run: |
        cd deployment-automation
        python scripts/environment_setup.py --verbose

    - name: Validate Session Management
      run: |
        python deployment-automation/scripts/validate_session_management.py

    - name: Validate CSF NIP Integration
      run: |
        python deployment-automation/scripts/validate_csf_nip.py

    - name: Health Check
      run: |
        python deployment-automation/scripts/health_check.py --environment ${{ matrix.environment }}

    - name: Generate Validation Report
      run: |
        python deployment-automation/scripts/generate_validation_report.py --output validation-report-${{ matrix.environment }}.json

    - name: Upload Validation Reports
      uses: actions/upload-artifact@v3
      with:
        name: validation-reports-${{ matrix.environment }}
        path: validation-report-${{ matrix.environment }}.json

  # Stage 4: Security and Compliance
  security-compliance:
    name: Security & Compliance
    runs-on: ubuntu-latest
    needs: [code-quality, testing]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Setup Trivy Vulnerability Scanner
      run: |
        sudo apt-get update
        sudo apt-get install wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy

    - name: Run Security Scans
      run: |
        # File system scan
        trivy fs --format json --output fs-security-report.json .

        # Python dependency scan
        pip install safety
        safety check --json --output dependency-scan.json

    - name: OWASP Compliance Check
      run: |
        python deployment-automation/scripts/owasp_compliance_check.py

    - name: CSF NIP Compliance Validation
      run: |
        python deployment-automation/scripts/csf_nip_compliance.py

    - name: Generate Security Report
      run: |
        python deployment-automation/scripts/generate_security_report.py

    - name: Upload Security Reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          fs-security-report.json
          dependency-scan.json
          security-report.json
          compliance-report.json

  # Stage 5: Performance Testing
  performance-testing:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: [code-quality, testing, environment-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Setup Environment
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        uv sync --dev

    - name: Load Testing
      run: |
        python deployment-automation/scripts/load_test.py --duration 300 --concurrent 50

    - name: Performance Profiling
      run: |
        python deployment-automation/scripts/performance_profiler.py

    - name: Memory Leak Detection
      run: |
        python deployment-automation/scripts/memory_leak_test.py

    - name: Generate Performance Report
      run: |
        python deployment-automation/scripts/generate_performance_report.py

    - name: Upload Performance Reports
      uses: actions/upload-artifact@v3
      with:
        name: performance-reports
        path: |
          load-test-results.json
          performance-profile.json
          memory-leak-report.json
          performance-report.json

  # Stage 6: Build and Package
  build-package:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [code-quality, testing, environment-validation, security-compliance]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Setup Build Environment
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        uv sync --dev

    - name: Build Package
      run: |
        uv build

    - name: Generate Documentation
      run: |
        cd __csf.nip
        uv run sphinx-build -b html docs/ docs/_build/html

    - name: Create Deployment Package
      run: |
        cd deployment-automation
        python scripts/create_deployment_package.py --version ${{ github.sha }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: deployment-package
        path: |
          dist/
          __csf.nip/docs/_build/html/
          deployment-automation/packages/

  # Stage 7: Deployment (Staging)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-package, performance-testing]
    environment: staging
    if: github.ref == 'refs/heads/develop'

    steps:
    - name: Download Build Artifacts
      uses: actions/download-artifact@v3
      with:
        name: deployment-package
        path: ./artifacts

    - name: Setup Deployment Environment
      run: |
        python deployment-automation/scripts/setup_staging_environment.py

    - name: Deploy to Staging
      run: |
        python deployment-automation/scripts/deploy.py \
          --environment staging \
          --package ./artifacts \
          --version ${{ github.sha }}

    - name: Smoke Tests
      run: |
        python deployment-automation/scripts/smoke_tests.py --environment staging

    - name: Rollback on Failure
      if: failure()
      run: |
        python deployment-automation/scripts/rollback.py --environment staging

  # Stage 8: Deployment (Production)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-package, performance-testing]
    environment: production
    if: github.event_name == 'release'

    steps:
    - name: Download Build Artifacts
      uses: actions/download-artifact@v3
      with:
        name: deployment-package
        path: ./artifacts

    - name: Production Readiness Check
      run: |
        python deployment-automation/scripts/production_readiness_check.py

    - name: Deploy to Production
      run: |
        python deployment-automation/scripts/deploy.py \
          --environment production \
          --package ./artifacts \
          --version ${{ github.ref_name }}

    - name: Production Health Check
      run: |
        python deployment-automation/scripts/production_health_check.py

    - name: Performance Monitoring
      run: |
        python deployment-automation/scripts/monitor_deployment.py \
          --environment production \
          --duration 1800  # 30 minutes

    - name: Rollback on Failure
      if: failure()
      run: |
        python deployment-automation/scripts/emergency_rollback.py --environment production

  # Stage 9: Post-Deployment
  post-deployment:
    name: Post-Deployment Tasks
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')

    steps:
    - name: Collect Metrics
      run: |
        python deployment-automation/scripts/collect_deployment_metrics.py

    - name: Generate Deployment Report
      run: |
        python deployment-automation/scripts/generate_deployment_report.py

    - name: Notify Teams
      run: |
        python deployment-automation/scripts/notify_teams.py

    - name: Update Documentation
      run: |
        python deployment-automation/scripts/update_deployment_docs.py

    - name: Cleanup Old Artifacts
      run: |
        python deployment-automation/scripts/cleanup_artifacts.py --keep-days 30

  # Stage 10: Monitoring and Alerting Setup
  monitoring-setup:
    name: Monitoring & Alerting
    runs-on: ubuntu-latest
    needs: [code-quality, testing]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Monitoring
      run: |
        python deployment-automation/scripts/setup_monitoring.py

    - name: Configure Alerting Rules
      run: |
        python deployment-automation/scripts/setup_alerting.py

    - name: Create Dashboards
      run: |
        python deployment-automation/scripts/create_dashboards.py

    - name: Test Alerting System
      run: |
        python deployment-automation/scripts/test_alerting.py

  # Workflow Status Summary
  workflow-summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [code-quality, testing, environment-validation, security-compliance, performance-testing, build-package]
    if: always()

    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v3

    - name: Generate Workflow Summary
      run: |
        python deployment-automation/scripts/generate_workflow_summary.py

    - name: Create Summary Comment
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('workflow-summary.json', 'utf8');
          const data = JSON.parse(summary);

          const comment = `
          # 🚀 Task Execution Enhancements CI/CD Summary

          ## 📊 Workflow Status
          - **Code Quality**: ${data.code_quality} (Score: ${data.quality_score}/100)
          - **Testing**: ${data.testing}
          - **Environment Validation**: ${data.environment_validation}
          - **Security Compliance**: ${data.security_compliance}
          - **Performance Testing**: ${data.performance_testing}
          - **Build & Package**: ${data.build_package}

          ## 📈 Metrics
          - **Total Tests Run**: ${data.total_tests}
          - **Test Coverage**: ${data.test_coverage}%
          - **Security Issues**: ${data.security_issues}
          - **Performance Score**: ${data.performance_score}/100

          ## 📋 Artifacts
          - Quality Reports: Available
          - Test Results: Available
          - Deployment Package: Available
          - Security Reports: Available

          ---
          *Generated on ${new Date().toISOString()}*
          `;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  # Notification Job
  notifications:
    name: Notifications
    runs-on: ubuntu-latest
    needs: [workflow-summary]
    if: always()

    steps:
    - name: Notify on Success
      if: success()
      run: |
        echo "✅ Pipeline completed successfully!"
        # Add Slack/Teams notification logic here

    - name: Notify on Failure
      if: failure()
      run: |
        echo "❌ Pipeline failed!"
        # Add Slack/Teams notification logic here

    - name: Cleanup
      if: always()
      run: |
        echo "🧹 Cleaning up..."
        # Cleanup temporary resources
