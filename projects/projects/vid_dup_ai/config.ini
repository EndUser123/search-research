; Video Dedupe AI Configuration File
[Execution Control & Performance]
dry_run = False
yes = False
max_workers = 10
task_timeout = 300
[Safety and Logging]
verbose = False
log = ./logs/vda_log.json
quarantine_dir = ./_quarantined_videos
[Matching and Filtering]
extensions = .mp4, .mov, .mkv, .avi, .webm
duration_tolerance = 2.0
fuzzy_match_threshold = 85
[Perceptual Hashing]
perceptual_hash = True
hash_threshold = 7
scene_threshold = 27.0
[Quality Assessment]
quality_metric = vmaf
ffmpeg_timeout = 60
[AI Categorization]
categorize = False
organization_dir = ./_organized_videos
device = auto
categorize_model = MCG-NJU/videomae-base-finetuned-kinetics-400
categorize_mode = best
categorize_batch_size = 4
categorize_inference_frames = 16
