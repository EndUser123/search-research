automated_responses:
  cleanup_logs:
    enabled: true
    retention_days: 7
    threshold_percent: 80
  escalate:
    enabled: true
    escalation_levels:
    - manager
    - director
    - vp
    escalation_time_minutes:
    - 15
    - 30
    - 60
  restart_service:
    cooldown_minutes: 10
    enabled: true
    max_attempts: 3
notification_channels:
  email:
    enabled: true
    recipients:
    - admin@example.com
    - ops@example.com
    smtp_port: 587
    smtp_server: smtp.example.com
  slack:
    channel: '#alerts'
    enabled: true
    webhook_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
  webhook:
    auth_header: Bearer YOUR_TOKEN
    enabled: true
    url: https://api.example.com/webhooks/alerts
rules:
- actions:
  - log_warning
  - check_processes
  cooldown_minutes: 5
  message: 'CPU usage is high: {value}%'
  metric: cpu_usage
  name: high_cpu_usage
  operator: '>'
  severity: WARNING
  threshold: 80
- actions:
  - send_alert
  - check_memory_leaks
  - restart_service
  cooldown_minutes: 2
  message: 'Memory usage is critical: {value}%'
  metric: memory_usage
  name: critical_memory_usage
  operator: '>'
  severity: CRITICAL
  threshold: 90
- actions:
  - log_error
  - check_logs
  - escalate
  cooldown_minutes: 10
  message: 'Error rate is high: {value}%'
  metric: error_rate
  name: high_error_rate
  operator: '>'
  severity: ERROR
  threshold: 0.1
- actions:
  - log_warning
  - cleanup_logs
  - check_disk_space
  cooldown_minutes: 30
  message: 'Disk usage is high: {value}%'
  metric: disk_usage
  name: disk_space_low
  operator: '>'
  severity: WARNING
  threshold: 90
- actions:
  - log_error
  - check_integrity
  - manual_intervention
  cooldown_minutes: 15
  message: GEW checkpoint creation failed
  metric: checkpoint_creation_failure
  name: gew_checkpoint_failure
  operator: '>'
  severity: ERROR
  threshold: 1
