name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18' # Specify Node.js version as per ARD
        cache: 'npm'
        cache-dependency-path: 'src/frontend_ui/package-lock.json'

    - name: Install frontend dependencies
      run: npm install
      working-directory: src/frontend_ui

    - name: Run frontend lint and format checks
      run: |
        npm run lint
        npm run format:check
      working-directory: src/frontend_ui

    - name: Run frontend tests
      run: npm test
      working-directory: src/frontend_ui

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.11' # Specify Python version as per ARD
        cache: 'pip'
        cache-dependency-path: 'src/backend_engine/requirements.txt'

    - name: Install backend dependencies
      run: pip install -e .[dev]
      working-directory: src/backend_engine

    - name: Run backend lint and format checks
      run: |
        ruff check .
        ruff format --check .
      working-directory: src/backend_engine

    - name: Run backend tests
      run: pytest
      working-directory: src/backend_engine
