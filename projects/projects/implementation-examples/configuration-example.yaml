# Code Review System Configuration Example
# This file demonstrates the comprehensive configuration options
# for the enterprise code review architecture

# System-wide Configuration
system:
  version: "1.0.0"
  environment: "production"
  debug: false

  # Core Settings
  core:
    # Plugin System
    plugins:
      auto_discover: true
      update_interval: "24h"
      security_scan: true
      dependency_validation: true

      # Plugin Sources
      sources:
        - type: "local"
          path: "./plugins"
          recursive: true
        - type: "npm"
          registry: "https://registry.npmjs.org"
          scope: "@codereview"
          version_constraints:
            security: ">=2.0.0"
            performance: ">=1.5.0"
        - type: "git"
          repositories:
            - "https://github.com/enterprise/plugins"
            - "https://gitlab.enterprise.com/plugins"
          branch: "main"
          update_strategy: "auto"

    # Parallel Processing
    parallel_processing:
      enabled: true
      max_concurrent_tasks: 20
      task_timeout: "10m"
      retry_attempts: 3
      retry_backoff: "exponential"

      # Resource Limits
      resource_limits:
        cpu: "8 cores"
        memory: "16GB"
        disk: "100GB"
        network: "1Gbps"
        gpu: 0

      # Optimization Settings
      optimization:
        cache_results: true
        smart_scheduling: true
        dependency_aware: true
        load_balancing: true

# Plugin Configuration
plugins:
  # Security Plugin
  security:
    enabled: true
    priority: "critical"
    timeout: "5m"
    configuration:
      # Security Rulesets
      rulesets:
        - "owasp-top-ten"
        - "security-best-practices"
        - "enterprise-security"

      # Custom Rules
      custom_rules:
        path: "./security-rules/"
        format: "yaml"
        auto_reload: true

      # Scanning Options
      scanning:
        deep_scan: true
        include_dependencies: true
        secret_detection: true
        vulnerability_database: "updated_daily"

      # Compliance Frameworks
      compliance:
        frameworks:
          - "SOC2"
          - "ISO27001"
          - "GDPR"
          - "HIPAA"
        custom_policies:
          path: "./compliance-policies/"

      # Reporting
      reporting:
        detailed_reports: true
        risk_scoring: true
        trend_analysis: true
        export_formats: ["json", "pdf", "sarif"]

  # Performance Plugin
  performance:
    enabled: true
    priority: "high"
    timeout: "3m"
    configuration:
      # Analysis Types
      analysis_types:
        complexity_analysis: true
        memory_profiling: true
        performance_patterns: true
        benchmarking: true

      # Thresholds
      thresholds:
        complexity:
          cyclomatic: 10
          cognitive: 15
          maintainability: 20
        performance:
          response_time: "500ms"
          memory_usage: "100MB"
          cpu_usage: "80%"
        coverage:
          minimum: 80
          target: 90

      # Benchmarking
      benchmarking:
        enabled: true
        baseline_required: true
        regression_detection: true
        improvement_tracking: true

  # Language-Specific Plugins
  language_analyzers:
    javascript:
      enabled: true
      priority: "medium"
      tools:
        - "eslint"
        - "typescript"
        - "prettier"
      rules:
        extends: ["@company/javascript"]
        custom_rules: "./rules/javascript/"

    python:
      enabled: true
      priority: "medium"
      tools:
        - "pylint"
        - "black"
        - "mypy"
      rules:
        extends: ["@company/python"]
        custom_rules: "./rules/python/"

    java:
      enabled: true
      priority: "medium"
      tools:
        - "checkstyle"
        - "spotbugs"
        - "pmd"
      rules:
        extends: ["@company/java"]
        custom_rules: "./rules/java/"

# Subagent Configuration
subagents:
  # Security Agent
  security:
    enabled: true
    model: "gpt-4"
    specialization: "application_security"
    parallel_instances: 2
    configuration:
      expertise_domains:
        - "web_security"
        - "api_security"
        - "infrastructure_security"
        - "cloud_security"
      analysis_depth: "thorough"
      vulnerability_types:
        - "injection"
        - "xss"
        - "csrf"
        - "authentication"
        - "authorization"
      compliance_standards:
        - "OWASP"
        - "NIST"
        - "PCI-DSS"

  # Performance Agent
  performance:
    enabled: true
    model: "claude-3-opus"
    specialization: "performance_optimization"
    parallel_instances: 1
    configuration:
      expertise_domains:
        - "algorithmic_optimization"
        - "database_performance"
        - "network_optimization"
        - "memory_management"
      optimization_level: "aggressive"
      benchmark_comparison: true
      regression_detection: true

  # Architecture Agent
  architecture:
    enabled: true
    model: "gpt-4"
    specialization: "software_architecture"
    parallel_instances: 1
    configuration:
      expertise_domains:
        - "design_patterns"
        - "system_architecture"
        - "microservices"
        - "scalability"
      analysis_scope: "comprehensive"
      design_principles:
        - "SOLID"
        - "DRY"
        - "YAGNI"
        - "KISS"

# Integration Configuration
integrations:
  # GitHub Integration
  github:
    enabled: true
    configuration:
      # Authentication
      auth:
        app_id: ${GITHUB_APP_ID}
        private_key: ${GITHUB_PRIVATE_KEY}
        webhook_secret: ${GITHUB_WEBHOOK_SECRET}

      # API Configuration
      api:
        base_url: "https://api.github.com"
        rate_limit:
          requests_per_hour: 5000
          retry_on_limit: true
        timeout: "30s"

      # Repository Settings
      repositories:
        include_patterns:
          - "*/important-*"
          - "*/security-*"
        exclude_patterns:
          - "*/test-*"
          - "*/docs-*"
        default_config:
          auto_review: true
          require_approval: false
          status_checks: true

      # Review Configuration
      review:
        auto_review_on_open: true
        auto_review_on_sync: true
        comment_format: "detailed"
        inline_comments: true
        status_check_name: "code-review/bot"

        # Approval Rules
        approval_rules:
          auto_approve_threshold: 95
          require_approval_for_critical: true
          approval_conditions:
            security_score: ">= 8"
            performance_score: ">= 7"
            complexity_threshold: "<= 10"

  # GitLab Integration
  gitlab:
    enabled: false
    configuration:
      url: "https://gitlab.example.com"
      token: ${GITLAB_TOKEN}
      webhook_secret: ${GITLAB_WEBHOOK_SECRET}

  # CI/CD Integration
  ci_cd:
    enabled: true
    platforms:
      jenkins:
        enabled: true
        url: ${JENKINS_URL}
        token: ${JENKINS_TOKEN}
        job_name: "code-review"

      github_actions:
        enabled: true
        workflow_file: ".github/workflows/code-review.yml"
        auto_trigger: true

      azure_pipelines:
        enabled: false
        organization: ${AZURE_ORG}
        project: ${AZURE_PROJECT}

# Enterprise Features
enterprise:
  # Single Sign-On
  sso:
    enabled: true
    provider: "saml"
    configuration:
      idp_url: ${SSO_IDP_URL}
      sp_entity_id: ${SSO_ENTITY_ID}
      certificate: ${SSO_CERTIFICATE}
      attribute_mapping:
        email: "email"
        name: "name"
        groups: "groups"

  # Audit Logging
  audit_log:
    enabled: true
    retention: "1y"
    storage:
      type: "s3"
      bucket: "enterprise-audit-logs"
      encryption: true
    fields:
      - "timestamp"
      - "user"
      - "action"
      - "resource"
      - "result"
      - "ip_address"
      - "user_agent"

  # Role-Based Access Control
  rbac:
    enabled: true
    roles:
      admin:
        permissions:
          - "system:*"
          - "users:*"
          - "config:*"

      reviewer:
        permissions:
          - "reviews:read"
          - "reviews:write"
          - "reports:read"

      viewer:
        permissions:
          - "reviews:read"
          - "reports:read"

  # Compliance
  compliance:
    frameworks:
      - name: "SOC2"
        requirements:
          - "audit_logging"
          - "access_control"
          - "data_encryption"
          - "vulnerability_management"

      - name: "ISO27001"
        requirements:
          - "risk_assessment"
          - "incident_response"
          - "business_continuity"
          - "supplier_relationships"

# Monitoring and Observability
monitoring:
  # Metrics
  metrics:
    enabled: true
    prometheus:
      enabled: true
      port: 9090
      path: "/metrics"

    collection_interval: "30s"
    retention: "7d"

  # Logging
  logging:
    level: "info"
    format: "json"
    outputs:
      - type: "file"
        path: "/var/log/code-review/app.log"
        rotation: "daily"
        retention: "30d"
      - type: "elasticsearch"
        url: ${ELASTICSEARCH_URL}
        index: "code-review"

  # Health Checks
  health_checks:
    enabled: true
    endpoints:
      - "/health"
      - "/health/ready"
      - "/health/live"
    checks:
      - name: "database"
        timeout: "5s"
      - name: "plugins"
        timeout: "10s"
      - name: "external_apis"
        timeout: "15s"

  # Alerting
  alerting:
    enabled: true
    channels:
      slack:
        webhook_url: ${SLACK_WEBHOOK_URL}
        channel: "#code-review-alerts"

      email:
        smtp_server: ${SMTP_SERVER}
        recipients:
          - "devops@company.com"
          - "security@company.com"

    rules:
      - name: "high_error_rate"
        condition: "error_rate > 0.05"
        duration: "5m"
        severity: "critical"

      - name: "slow_analysis"
        condition: "analysis_time > 10m"
        duration: "1m"
        severity: "warning"

# Performance and Scaling
performance:
  # Caching
  cache:
    enabled: true
    type: "redis"
    configuration:
      host: ${REDIS_HOST}
      port: 6379
      database: 0
      tls: true

    settings:
      default_ttl: "1h"
      max_size: "1GB"
      compression: true

  # Database
  database:
    type: "postgresql"
    configuration:
      host: ${DB_HOST}
      port: 5432
      database: ${DB_NAME}
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      ssl_mode: "require"

    connection_pool:
      min_connections: 5
      max_connections: 20
      idle_timeout: "5m"

  # Scaling
  scaling:
    auto_scaling:
      enabled: true
      min_instances: 2
      max_instances: 10
      target_cpu_utilization: 70
      target_memory_utilization: 80

    load_balancing:
      algorithm: "round_robin"
      health_check_interval: "30s"
      session_affinity: false

# Development and Testing
development:
  # Testing
  testing:
    unit_tests:
      enabled: true
      coverage_threshold: 80
      command: "npm test"

    integration_tests:
      enabled: true
      environment: "docker"
      command: "npm run test:integration"

    e2e_tests:
      enabled: true
      environment: "staging"
      command: "npm run test:e2e"

  # Local Development
  local:
    hot_reload: true
    debug_mode: true
    mock_external_services: true

    development_plugins:
      path: "./plugins/dev"
      auto_reload: true

# Security Settings
security:
  # API Security
  api_security:
    rate_limiting:
      enabled: true
      requests_per_minute: 100
      burst: 200

    authentication:
      required: true
      methods: ["bearer_token", "api_key"]

    cors:
      enabled: true
      origins: ["https://company.com"]
      methods: ["GET", "POST", "PUT", "DELETE"]

  # Data Security
  data_security:
    encryption_at_rest: true
    encryption_in_transit: true
    key_management:
      type: "aws_kms"
      key_id: ${KMS_KEY_ID}

  # Plugin Security
  plugin_security:
    sandbox_mode: true
    resource_limits:
      memory: "512MB"
      cpu: "1 core"
      disk: "100MB"

    signature_verification: true
    vulnerability_scan: true
