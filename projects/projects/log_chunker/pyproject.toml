[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "log_chunker"
version = "0.1.0"
description = "Advanced log chunking tool with semantic analysis"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.21.0",
    "loguru>=0.7.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "hdbscan",
]
text = [
    "langdetect>=1.0.9",
    "fuzzywuzzy>=0.18.0",
    "python-levenshtein>=0.12.0",
    "PyYAML>=6.0",
    "networkx>=3.0",
]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "mypy",
    "ruff",
]

[project.scripts]
log-chunker = "log_chunker.log_chunker:main"

[project.urls]
Homepage = "https://github.com/yourusername/log_chunker"
Documentation = "https://github.com/yourusername/log_chunker/docs"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
