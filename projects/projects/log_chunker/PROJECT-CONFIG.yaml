# Project Configuration for log_chunker
# A tool for chunking and analyzing log files.
# Version: 1.0

project:
  name: "log_chunker"
  type: "project"
  version: "1.0"
  description: "A tool for chunking and analyzing log files."

# SYSTEM STRUCTURE
structure:
  source: "."
  tests: "tests/"  # Assuming a future tests directory
  docs: "docs/"
  reports: "reports/"
  logs: "logs/"
  plugins: "plugins/"
  source_logs: "source_logs/"
  chunks: "chunks/"

# ENHANCED CONFIGURATION SYSTEM
configuration:
  workspace_config: "../workspace-config.yaml"
  project_config_pattern: "*/PROJECT-CONFIG.yaml"

# DEPENDENCIES
dependencies:
  - file: "requirements.txt"
    manager: "pip"

# SCRIPTS
scripts:
  install: "pip install -r requirements.txt"
  test: "pytest"
  lint: "ruff check ."
  run: "python cli.py"

# ENVIRONMENT
environment:
  runtime: "python>=3.8"

# DEPLOYMENT
deployment:
  method: "local"
  target: "local"

# SECRETS
secrets:
  management_strategy: "Not currently used"

# PROJECT MANAGEMENT
project_management:
  status_file: "PROJECT_STATUS.md"
  change_log: "docs/CHANGE_LOG.md" # Assuming a future changelog
  issue_tracking: "docs/issues/" # Assuming a future issue tracker

# RESOURCES
resources:
  architecture_decision_records: "docs/architecture/"
  product_requirements_document: "docs/requirements/"
  vision_and_scope: "docs/project_management/"
  api_specification: "docs/development/"
  user_guide: "docs/user/"
  operational_guide: "docs/operations/"
  use_cases: "docs/USE_CASES.md"

# INTERFACE
interface:
  cli:
    description: "Command-line interface for the log_chunker tool."
    arguments:
      - name: "input_file"
        type: "string"
        required: true
        description: "Path to the source log file to be processed."
      - name: "--output-dir"
        type: "string"
        required: false
        default: "chunks/"
        description: "Output directory for temporary chunk files."
      - name: "--reports-dir"
        type: "string"
        required: false
        default: "reports/"
        description: "Output directory for final reports."
      - name: "--config"
        type: "string"
        required: false
        description: "Path to a JSON configuration file to override defaults."
      - name: "--target-tokens"
        type: "integer"
        required: false
        description: "Target token size for each chunk."
      - name: "--enable-semantic"
        type: "boolean"
        required: false
        description: "Enable semantic chunking."
      - name: "--enable-perplexity"
        type: "boolean"
        required: false
        description: "Enable perplexity-based chunking."
      - name: "--llm-smart-mode"
        type: "boolean"
        required: false
        description: "Enable all smart LLM optimizations automatically."
      - name: "--auto-optimize"
        type: "boolean"
        required: false
        default: true
        description: "Automatically apply optimized configuration without prompting."
      - name: "--plugin"
        type: "list"
        required: false
        description: "Load an external plugin file (can be specified multiple times)."

