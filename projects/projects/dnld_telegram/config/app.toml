# Telegram Downloader - Main Configuration
# This is the primary configuration file for the application

[app]
name = "Telegram Downloader"
version = "2.0"
description = "Download and manage media from Telegram channels"

[paths]
# Base directory for all channel data (databases, media, temp files)
# Priority: env var CHANNELS_BASE_PATH > config > default
channels_base = "E:/dnld_media/telegram/channels"

# Temporary storage for downloads in progress
temp_base = "${channels_base}/_temp"

# Completed downloads storage
media_base = "${channels_base}/_media"

# Database storage
database_base = "${channels_base}/_databases"

# Log files location
logs_base = "logs"

[database]
# SQLite settings
connection_timeout = 30
max_connections = 5
pragma_settings = [
    "journal_mode=WAL",
    "synchronous=NORMAL",
    "cache_size=10000",
    "temp_store=memory"
]

# Sharding configuration
shard_threshold_gb = 5.0
max_shard_size_gb = 50.0
auto_shard = true

[download]
# Default concurrent downloads
max_concurrent = 2

# Network timeout settings
connection_timeout = 30
read_timeout = 60
retry_attempts = 3
retry_delay = 2

# File handling
verify_downloads = true
cleanup_temp_on_exit = true
organize_by_channel = true

[logging]
# Log levels: DEBUG, INFO, WARNING, ERROR, CRITICAL
console_level = "WARNING"
file_level = "DEBUG"

# Log file settings
max_size_mb = 50
backup_count = 5
retention_days = 30

# Log format
format = "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"

[ui]
# Default UI mode: tqdm, simple, rich, textual, alive
default_mode = "tqdm"
fallback_mode = "simple"

# Progress display settings
show_speed = true
show_eta = true
show_file_progress = true
update_frequency = 0.1

[performance]
# Memory management
max_memory_mb = 1024
gc_threshold = 100

# I/O settings
buffer_size = 65536
use_aiofiles = true
