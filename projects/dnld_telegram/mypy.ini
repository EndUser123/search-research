[mypy]
# Basic configuration for incremental refactoring
explicit_package_bases = True
namespace_packages = True
mypy_path = src

# Start lenient, tighten over time
ignore_missing_imports = True
no_strict_optional = True
allow_untyped_defs = True
allow_incomplete_defs = True
allow_untyped_calls = True

# Focus on critical errors first
show_error_codes = True
show_column_numbers = True

# Skip problematic third-party libraries
[mypy-telethon.*]
follow_imports = skip

[mypy-asyncpraw.*]
follow_imports = skip

[mypy-tqdm.*]
follow_imports = skip

[mypy-rich.*]
follow_imports = skip

[mypy-textual.*]
follow_imports = skip
