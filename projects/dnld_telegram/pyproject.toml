[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnld_telegram"
version = "0.1.0"
description = "Enhanced Telegram Media Downloader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",
    "telethon>=1.24.0",
    "python-dotenv>=0.19.0",
    "pydantic>=2.0",
    "toml>=0.10.2",
    "aiosqlitepool>=0.1.0",
    "tomli>=2.2.1",
    "aiosqlite>=0.21.0",
    "tree-sitter>=0.25.1",
    "tree-sitter-python>=0.23.6",
]

[project.scripts]
dnld_telegram = "dnld_telegram.__main__:main"

[tool.setuptools]
package-dir = {"dnld_telegram" = "src/dnld_telegram"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dnld_telegram*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "mypy>=1.17.1",
    "pip-audit>=2.9.0",
    "pydocstyle>=6.3.0",
    "pylint>=3.3.8",
    "pytest-cov>=6.2.1",
    "pytest-asyncio>=0.24.0",
    "psutil>=5.9.0",
    "radon>=6.0.1",
    "types-pyyaml>=6.0.12.20250809",
    "types-toml>=0.10.8.20240310",
    "vulture>=2.14",
]
