# UI Configuration for Telegram Downloader
# This file configures the user interface displays

ui:
  # Default display type: tqdm, simple, alive, textual, rich
  default_display: "tqdm"

  # Fallback display if default is not available
  fallback_display: "simple"

  # Maximum concurrent downloads
  max_concurrent: 2

  # Display options
  show_progress: true
  show_speed: true
  show_eta: true

  # Network timeout in seconds
  timeout: 30

# Display-specific settings
displays:
  tqdm:
    # Terminal width for progress bar
    ncols: 100
    # Custom bar format
    bar_format: "{l_bar}{bar}| {n_fmt}/{total_fmt} [{elapsed}<{remaining}, {rate_fmt}]"

  alive:
    # Progress bar style
    bar: "smooth"
    # Spinner animation
    spinner: "dots_waves"
    # Show performance monitor
    monitor: true
    # Show statistics at end
    stats_end: true

  rich:
    # Don't clear progress when done
    transient: false
    # Show download speed
    show_speed: true
    # Console width
    width: null

  textual:
    # Seconds to keep UI open after completion
    auto_exit_delay: 3
    # App title
    title: "Telegram Downloader"

  simple:
    # Clear line before updating
    clear_line: true
    # Show header
    show_header: true

# Download settings (UI-related)
download:
  # Directory for downloads
  default_dir: "downloads"

  # Create subdirectories by channel
  organize_by_channel: true

  # Progress update frequency (seconds)
  update_frequency: 0.1
