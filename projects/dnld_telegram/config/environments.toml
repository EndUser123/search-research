# Environment-specific configuration overrides
# Usage: Set TELEGRAM_ENV=production to use [production] settings

[development]
# Development environment settings
[development.logging]
console_level = "DEBUG"
file_level = "DEBUG"

[development.download]
max_concurrent = 1  # Slower for debugging
verify_downloads = true

[development.database]
# Use smaller thresholds for testing
shard_threshold_gb = 1.0
max_shard_size_gb = 5.0

[production]
# Production environment settings
[production.logging]
console_level = "INFO"
file_level = "WARNING"

[production.download]
max_concurrent = 4  # More aggressive
verify_downloads = false  # Skip verification for speed

[production.database]
# Use optimized settings
connection_timeout = 60
pragma_settings = [
    "journal_mode=WAL",
    "synchronous=NORMAL",
    "cache_size=50000",  # Larger cache
    "temp_store=memory",
    "mmap_size=268435456"  # 256MB mmap
]

[testing]
# Testing environment settings
[testing.paths]
channels_base = "test_channels"
logs_base = "test_logs"

[testing.download]
max_concurrent = 1
connection_timeout = 5  # Fast timeouts for tests
retry_attempts = 1

[testing.database]
shard_threshold_gb = 0.1  # Very small for testing
