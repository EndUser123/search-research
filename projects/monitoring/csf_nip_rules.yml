# Prometheus alerting rules for CSF NIP Workspace
# Defines alerts for build processes, application health, and performance

groups:
  # Build process alerts
  - name: csf_nip_build_alerts
    rules:
      - alert: BuildFailure
        expr: build_success_total == 0
        for: 5m
        labels:
          severity: critical
          service: build
        annotations:
          summary: "Build process has failed"
          description: "Build process has been failing for the last 5 minutes"

      - alert: BuildDurationHigh
        expr: build_duration_seconds > 300
        for: 10m
        labels:
          severity: warning
          service: build
        annotations:
          summary: "Build duration is unusually high"
          description: "Build duration is {{ $value }} seconds, which is above the 5 minute threshold"

      - alert: BuildQueueLength
        expr: build_queue_length > 10
        for: 5m
        labels:
          severity: warning
          service: build
        annotations:
          summary: "Build queue is backing up"
          description: "Build queue length is {{ $value }}, which indicates resource contention"

  # Test suite alerts
  - name: csf_nip_test_alerts
    rules:
      - alert: TestFailureRate
        expr: (test_failures_total / test_runs_total) > 0.1
        for: 5m
        labels:
          severity: warning
          service: testing
        annotations:
          summary: "Test failure rate is high"
          description: "Test failure rate is {{ $value | humanizePercentage }}, which is above 10%"

      - alert: TestSuiteTimeout
        expr: test_duration_seconds > 1800
        for: 1m
        labels:
          severity: critical
          service: testing
        annotations:
          summary: "Test suite is taking too long"
          description: "Test suite has been running for {{ $value }} seconds, which exceeds the 30 minute timeout"

      - alert: LowTestCoverage
        expr: test_coverage_percentage < 80
        for: 5m
        labels:
          severity: warning
          service: testing
        annotations:
          summary: "Test coverage is below threshold"
          description: "Test coverage is {{ $value }}%, which is below the 80% threshold"

  # Application performance alerts
  - name: csf_nip_performance_alerts
    rules:
      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / 1024 / 1024) > 1024
        for: 10m
        labels:
          severity: warning
          service: performance
        annotations:
          summary: "Memory usage is high"
          description: "Memory usage is {{ $value }}MB, which exceeds the 1GB threshold"

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: performance
        annotations:
          summary: "CPU usage is high"
          description: "CPU usage is {{ $value }}%, which exceeds the 80% threshold"

      - alert: SlowResponseTime
        expr: http_request_duration_seconds{quantile="0.95"} > 2
        for: 5m
        labels:
          severity: warning
          service: performance
        annotations:
          summary: "Response time is slow"
          description: "95th percentile response time is {{ $value }} seconds, which exceeds the 2 second threshold"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          service: performance
        annotations:
          summary: "Error rate is high"
          description: "Error rate is {{ $value | humanizePercentage }}, which exceeds the 5% threshold"

  # Dependency management alerts
  - name: csf_nip_dependency_alerts
    rules:
      - alert: VulnerableDependencies
        expr: vulnerable_dependencies_total > 0
        for: 1m
        labels:
          severity: critical
          service: security
        annotations:
          summary: "Vulnerable dependencies detected"
          description: "Found {{ $value }} vulnerable dependencies that need to be addressed"

      - alert: OutdatedDependencies
        expr: outdated_dependencies_total > 10
        for: 30m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "Many outdated dependencies"
          description: "Found {{ $value }} outdated dependencies that should be updated"

      - alert: LicenseComplianceIssue
        expr: non_compliant_licenses_total > 0
        for: 1m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "License compliance issues"
          description: "Found {{ $value }} dependencies with non-compliant licenses"

  # Security alerts
  - name: csf_nip_security_alerts
    rules:
      - alert: SecurityScanFailure
        expr: security_scan_success == 0
        for: 5m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "Security scan has failed"
          description: "Security scan has been failing for the last 5 minutes"

      - alert: HighSecurityRiskScore
        expr: security_risk_score > 7
        for: 1m
        labels:
          severity: critical
          service: security
        annotations:
          summary: "High security risk score"
          description: "Security risk score is {{ $value }}, which is above the acceptable threshold"

      - alert: UnusualAccessPattern
        expr: rate(unusual_access_events_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "Unusual access patterns detected"
          description: "Detected {{ $value }} unusual access events per second"

  # Infrastructure alerts
  - name: csf_nip_infrastructure_alerts
    rules:
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
          service: infrastructure
        annotations:
          summary: "Disk space is low"
          description: "Disk space is {{ $value }}% full, which is below the 10% threshold"

      - alert: HighDiskIO
        expr: rate(node_disk_io_time_seconds_total[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "High disk I/O usage"
          description: "Disk I/O usage is {{ $value }}%, which exceeds the 80% threshold"

      - alert: NetworkLatencyHigh
        expr: probe_duration_seconds > 1
        for: 2m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "Network latency is high"
          description: "Network latency is {{ $value }} seconds, which exceeds the 1 second threshold"

  # Development workflow alerts
  - name: csf_nip_workflow_alerts
    rules:
      - alert: PRWithoutTests
        expr: pull_requests_without_tests > 0
        for: 30m
        labels:
          severity: warning
          service: development
        annotations:
          summary: "Pull requests without tests"
          description: "Found {{ $value }} pull requests without associated tests"

      - alert: StaleBranches
        expr: stale_branches_total > 5
        for: 60m
        labels:
          severity: warning
          service: development
        annotations:
          summary: "Many stale branches"
          description: "Found {{ $value }} branches that haven't been updated in over 30 days"

      - alert: LargeCommitSize
        expr: large_commits_total > 3
        for: 15m
        labels:
          severity: warning
          service: development
        annotations:
          summary: "Large commits detected"
          description: "Found {{ $value }} commits with over 1000 lines changed in the last 15 minutes"
