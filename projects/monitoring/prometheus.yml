# Prometheus configuration for CSF NIP Workspace monitoring
# Collects metrics from build processes, application performance, and system health

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: '${ENVIRONMENT:-development}'
    service: 'csf-nip-workspace'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "csf_nip_rules.yml"
  - "build_rules.yml"
  - "security_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s
    metrics_path: /metrics

  # CSF NIP workspace metrics
  - job_name: 'csf-nip-workspace'
    static_configs:
      - targets: ['host.docker.internal:8000']  # For development
      - targets: ['csf-nip-prod:8000']        # For production
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # Node exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 10s

  # cAdvisor for container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 10s
    metrics_path: /metrics

  # Build metrics
  - job_name: 'build-metrics'
    static_configs:
      - targets: ['build-exporter:9091']
    scrape_interval: 30s
    metrics_path: /metrics

  # Test metrics
  - job_name: 'test-metrics'
    static_configs:
      - targets: ['test-exporter:9092']
    scrape_interval: 60s
    metrics_path: /metrics

  # Dependency health checks
  - job_name: 'dependency-health'
    static_configs:
      - targets: ['dependency-exporter:9093']
    scrape_interval: 300s  # Every 5 minutes
    metrics_path: /metrics

  # Security metrics
  - job_name: 'security-metrics'
    static_configs:
      - targets: ['security-exporter:9094']
    scrape_interval: 600s  # Every 10 minutes
    metrics_path: /metrics

  # Database metrics (PostgreSQL)
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s
    metrics_path: /metrics

  # Redis metrics
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s
    metrics_path: /metrics

  # GPU metrics (if available)
  - job_name: 'gpu-exporter'
    static_configs:
      - targets: ['gpu-exporter:9445']
    scrape_interval: 15s
    metrics_path: /metrics

# Remote write configuration for long-term storage
remote_write:
  - url: "http://thanos-receive:19291/api/v1/receive"
    queue_config:
      max_samples_per_send: 1000
      max_shards: 200
      capacity: 2500

# Storage configuration
storage:
  tsdb:
    path: /prometheus
    retention.time: 15d
    retention.size: 10GB
