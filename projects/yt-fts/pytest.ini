[pytest]
# Pytest configuration for yt-fts


filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

pythonpath = src

# ==============================================================================
# TEST TIMEOUT
# ==============================================================================
# Purpose: Prevents tests from hanging indefinitely (which causes background
#          processes to get SIGKILL'd with exit code 137)
#
# - Individual tests timeout after 30 seconds
# - Thread-based timeout works on Windows (signal-based doesn't)
# - To override: pytest --timeout=0 (disable) or --timeout=120 (custom)
# - To mark slow tests: @pytest.mark.timeout(300)
# ==============================================================================
timeout = 30
timeout_method = thread
