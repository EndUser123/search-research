[project]
name = "backend_engine"
version = "0.1.0"
description = "YTAP Backend Engine"
dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = "tests/backend"
addopts = "--cov=src --cov-report=term-missing --no-cov-on-fail"
