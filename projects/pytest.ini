[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    --cov=__csf_nip
    --cov-report=html:htmlcov
    --cov-report=term-missing:skip-covered
    --cov-report=xml
    --cov-fail-under=70
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    security: marks tests as security critical
    performance: marks tests as performance tests
    unit: marks tests as unit tests (fast, isolated)
    regression: marks tests as regression prevention tests
    e2e: marks tests as end-to-end tests
    property: marks tests as property-based tests (Hypothesis)
    benchmark: marks tests that measure performance (pytest-benchmark)
    triage: marks tests related to TRIAGE phase

# Hypothesis profiles
[hypothesis]
profiles = dev, ci

[hypothesis.dev]
max_examples = 100
timeout = 500

[hypothesis.ci]
max_examples = 5000
timeout = 5000

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

[coverage:run]
source = __csf
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */dist-packages/*
    .tox/*
    .venv/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract

[coverage:html]
directory = htmlcov