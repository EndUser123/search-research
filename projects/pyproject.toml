[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-fancy-pypi-readme>=22.5"]
build-backend = "hatchling.build"

[project]
name = "csf-nip-workspace"
dynamic = ["version", "readme"]
description = "CSF NIP (Constitutional Software Framework - Neural Intelligence Platform) comprehensive development workspace"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "CSF NIP Development Team", email = "dev@csf-nip.org" },
]
maintainers = [
    { name = "CSF NIP Development Team", email = "dev@csf-nip.org" },
]
keywords = [
    "csf-nip",
    "constitutional-software",
    "neural-intelligence",
    "multi-agent",
    "swarm-intelligence",
    "tdd",
    "evidence-based-development",
    "workspace",
    "development-framework",
    "ai-orchestration",
    "plugin-architecture",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]

# Core dependencies - minimal set for workspace functionality
dependencies = [
    "click>=8.2.1",
    "rich>=14.1.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "aiohttp>=3.9.1",
    "asyncio-throttle>=1.0.2",
    "typing-extensions>=4.8.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "asyncio-mqtt>=0.16.0",
    "anyio>=4.0.0",
    "orjson>=3.9.0",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "rich-click>=1.7.0",
    "textual>=0.41.0",
]

[project.optional-dependencies]
# Intelligence and Evidence Detection (migrated from __csf)
intel = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "opencv-python>=4.5.0",
    "scikit-image>=0.19.0",
    "Pillow>=8.3.0",
