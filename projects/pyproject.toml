    "build-wheel = 'python -m build --wheel {args:.}'",
    "build-sdist = 'python -m build --sdist {args:.}'",
    "build-all = 'python -m build {args:.}'",
    "check-wheel = 'twine check dist/*.whl {args:.}'",
    "check-all = 'twine check dist/* {args:.}'",
