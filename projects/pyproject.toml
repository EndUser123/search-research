# Environment-specific configurations
[tool.hatch.envs.default]
dependencies = [
    "coverage[toml]>=7.4.0",
    "pytest>=8.4.1",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.1",
