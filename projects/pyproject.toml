    "griffe>=0.48.0",
]

# Monitoring and observability
monitoring = [
    "prometheus-client>=0.19.0",
    "psutil>=5.9.6",
    "structlog>=23.2.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "watchdog>=3.0.0",
    "threading2>=0.1.2",
    "multiprocessing-logging>=0.3.4",
]

# Background processing
background = [
    "celery>=5.3.4",
    "kombu>=5.3.4",
    "flower>=2.0.1",
    "redis>=5.0.1",
    "aioredis>=2.0.1",
]

# Workflow orchestration and feature flags (Build v2.0)
workflow = [
    "prefect>=3.0.0",
    "flagsmith>=3.0.0",
    # "pyrca>=1.0.0",  # Commented out until PyPI availability verified
]

# All dependencies for full workspace functionality
all = [
    "csf-nip-workspace[dev,ml,vector,gpu,web,database,docs,monitoring,background,intel]",
]

[project.urls]
Homepage = "https://github.com/csf-nip/workspace"
Documentation = "https://csf-nip.github.io/workspace/"
Repository = "https://github.com/csf-nip/workspace.git"
"Bug Tracker" = "https://github.com/csf-nip/workspace/issues"
Changelog = "https://github.com/csf-nip/workspace/blob/main/CHANGELOG.md"
"CSF NIP Documentation" = "https://csf-nip.org/docs"
"Source Code" = "https://github.com/csf-nip/workspace"

# Console scripts for workspace management
[project.scripts]
csf-nip = "csf_nip.cli:main"
csf-nip-init = "csf_nip.scripts.init_workspace:main"
csf-nip-build = "csf_nip.scripts.build:main"
csf-nip-test = "csf_nip.scripts.test_runner:main"
csf-nip-deploy = "csf_nip.scripts.deploy:main"
csf-nip-monitor = "csf_nip.scripts.monitor:main"
csf-nip-clean = "csf_nip.scripts.cleanup:main"
cwo = "features.cwo.cli:main"

# Plugin entry points for modular architecture
[project.entry-points."csf_nip.modules"]
# Core modules will register themselves here
# Examples:
# detection = "csf_nip.src.modules.detection:detection_module"
# ml_automation = "csf_nip.src.modules.ml_automation_cli:ml_module"
# performance = "csf_nip.src.modules.performance_optimization:performance_module"

[project.entry-points."csf_nip.commands"]
# Custom commands will register here
# Examples:
# analyze = "csf_nip.commands.analyze:main"
# test = "csf_nip.commands.test:main"
# deploy = "csf_nip.commands.deploy:main"

# Hatch build configuration
[tool.hatch.version]
source = "vcs"
fallback_version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = [
    "csf_nip",
    "src/core",
    "src/features",
    "src/infra",
    "src/cli",
    "src/csf_nip",
    "__csf/src/core",
    "__csf/src/features",
    "__csf/src/infra",
    "__csf/src/cli",
    "__csf/src/csf_nip",
]
exclude = [
    "*.pyc",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".coverage",
    "htmlcov",
    "*.egg-info",
]

[tool.hatch.build.targets.sdist]
include = [
    "/csf_nip",
    "/src/core",
    "/src/features",
    "/src/infra",
    "/src/cli",
    "/src/csf_nip",
    "/__csf/src/core",
    "/__csf/src/features",
    "/__csf/src/infra",
    "/__csf/src/cli",
    "/__csf/src/csf_nip",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "*.pyc",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".coverage",
    "htmlcov",
    "*.egg-info",
    ".git",
    ".tox",
    "venv",
    ".venv",
]

# Black code formatting configuration
[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __csf\.nip/backup
  | __csf\.nip/external-tools
)/
'''

# Ruff linting and formatting configuration
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "__csf/backup",
    "__csf/external-tools",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001",
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["ARG001"]

# isort configuration (integrated with ruff)
[tool.ruff.lint.isort]
known-first-party = ["csf_nip"]
known-third-party = ["pytest", "torch", "transformers", "numpy", "pandas"]

# MyPy type checking configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "sentence_transformers.*",
    "faiss.*",
    "chromadb.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=csf_nip",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-report=lcov",
    "--cov-fail-under=80",
]
norecursedirs = [
    ".git",
    ".venv",
    ".env",
    "data",
    "docs",
    "node_modules",
    "__pycache__",
    "site-packages",
    "external-tools",
    "backup",
]
testpaths = [
    "tests",
    "__csf/tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests that require GPU",
    "ml: marks tests that require ML dependencies",
    "web: marks tests that require web dependencies",
]

# Coverage configuration
[tool.coverage.run]
source = [
    "csf_nip",
    "src/csf_nip",
    "__csf/src",
]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
    "*/__pycache__/*",
    "*/.*cache/*",
    "*/site-packages/*",
    "__csf/backup/*",
    "__csf/external-tools/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2
fail_under = 80

# Bandit security scanning configuration
[tool.bandit]
exclude_dirs = [
    "tests",
    "test_*",
    "__pycache__",
    ".tox",
    ".eggs",
    "*.egg",
    "build",
    "dist",
    "__csf/backup",
    "__csf/external-tools",
]
tests = [
    "B201",  # flake8-bandit assertion
    "B301",  # pickle
