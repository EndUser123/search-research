# Memory Bank Integration Rules for dualllm-v2
name: "Development Intelligence Integration"
description: "Unified memory bank and issue tracking integration"
version: "1.0"
priority: high

triggers:
  session_start:
    action: "search_intelligence"
  session_end:
    action: "update_intelligence"

actions:
  search_intelligence:
    commands:
      - "python ..\.brain/memory_bank/tools/search_engine.py --projects dualllm-v2"
      - "python ..\.brain/tools/intelligence_search.py --project dualllm-v2"
    context: "Search development intelligence before starting work"

  update_intelligence:
    commands:
      - "python ..\.brain/integration/memory_issue_bridge.py suggest --project dualllm-v2 --issue-id {issue_id}"
    context: "Update intelligence systems after completing work"

guidelines:
  - "Search memory bank and issues before starting new work"
  - "Document insights that meet memory bank criteria"
  - "Link issues and memory entries when resolving problems"
  - "Tag appropriately for cross-project discovery"

project_config:
  name: "dualllm-v2"
  primary_tags: ["add-domain-specific-tags-here"]
  intelligence_integration: true
