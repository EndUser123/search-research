[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-chain-miner"
version = "0.1.0"
description = "Post-compact session chain walker, exporter, and miner for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
claude-chain-mine = "scripts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["P:/tests"]
pythonpath = ["."]
