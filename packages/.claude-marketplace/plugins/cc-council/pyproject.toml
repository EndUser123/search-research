[project]
name = "cc-council"
version = "1.0.0"
description = "Local-first multi-LLM council system for Claude Code"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["council_core"]
omit = ["tests/*"]