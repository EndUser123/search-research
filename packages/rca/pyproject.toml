[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rca"
version = "2.5.0"
description = "Unified debugging and Root Cause Analysis toolkit for Claude Code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "EndUser123"},
]
keywords = ["debug", "rca", "root-cause-analysis", "debugging", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.1.0", "mypy>=1.0"]
test = ["hypothesis>=6.0", "pytest>=7.0", "pytest-cov>=4.0", "pytest-mock>=3.10"]

[project.scripts]
rca = "rca.cli:main"

[project.urls]
Homepage = "https://github.com/EndUser123/rca"
Documentation = "https://github.com/EndUser123/rca#readme"
Repository = "https://github.com/EndUser123/rca"
Issues = "https://github.com/EndUser123/rca/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rca"]

[tool.hatch.build.targets.wheel.shared-data]
"skill" = "rca/skill"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["skill/tests"]
pythonpath = ["src"]
addopts = []
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
    "ignore::DeprecationWarning",
    "ignore::Warning",
]
