# loop-core Configuration Schema
# Version: 1
# This file controls the behavior of Ralph-style autonomous loops

# Configuration version (do not modify)
version: 1

# Enforcement Mode Configuration (TASK-018)
# Controls whether the loop uses full policy enforcement or minimal policy
enforcement:
  # When true: Full policy (all exit conditions apply)
  # When false: Minimal policy (EXIT_SIGNAL + completion_indicators only)
  # Default: true (backward compatible with existing behavior)
  enabled: true

# Exit Policy Configuration
# Controls when the autonomous loop should exit
exit_policy:
  # Minimum number of completion indicators before considering exit
  # Completion indicators are heuristic signals that work may be complete
  # Default: 2 (requires multiple indicators to reduce false positives)
  min_completion_indicators: 2

  # Require explicit EXIT_SIGNAL: true in plan file's RALPH_STATUS section
  # This is the LLM's explicit assertion that all work is complete and verified
  # Default: true (strongly recommended to prevent premature exit)
  require_exit_signal: true

  # Require all tasks in the plan to be marked as complete
  # Default: true (ensures no incomplete tasks are left behind)
  require_all_tasks_complete: true

  # Require verification pass before exit
  # When true, the configured verification skill must pass
  # Default: true (ensures quality before completion)
  require_verification_pass: true

# Verification Configuration
# Controls verification behavior before loop exit
verification:
  # Enable or disable verification
  # Default: true (verification is strongly recommended)
  enabled: true

  # Name of the verification skill to run
  # This skill will be invoked before loop exit
  # Default: "prd-verifier" (verifies against PRD requirements)
  skill: prd-verifier

  # Path to write verification report
  # Report will be in Markdown format
  # Default: ".claude/loop/verification-report.md"
  write_report: .claude/loop/verification-report.md

  # Verification fields to include in report
  # These define what aspects of the implementation to verify
  # Default: ["prd_coverage", "spec_compliance", "implementation_quality"]
  fields:
    - prd_coverage
    - spec_compliance
    - implementation_quality

# Plan Configuration
# Controls plan file management
plans:
  # Default plan file to use if none specified
  # Can be overridden in /loop-code command
  # Default: "plan.md"
  default_plan: plan.md

  # Allow each terminal to have its own plan file
  # When true, terminals can use plan-{terminal_id}.md
  # Useful for parallel development on different features
  # Default: true (enables multi-terminal isolation)
  allow_per_terminal_plan: true

# Logging Configuration
# Controls loop execution logging
logging:
  # Path to decision log file
  # Records loop exit/continue decisions with rationale
  # Default: "decision.log" (relative to state directory)
  decision_log: decision.log

  # Path to verifier log file
  # Records verification skill execution results
  # Default: "verifier.log" (relative to state directory)
  verifier_log: verifier.log
