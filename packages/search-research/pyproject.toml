[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "search-research"
version = "0.1.0"
description = "Unified search and research system with async concurrent execution, HyDE enhancement, and 11 web providers. Replaces deprecated unified-search (EOL: 2026-09-01)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "CSF Development Team"}
]
keywords = ["search", "research", "code search", "knowledge search", "web search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Search Engines",
]

dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.32.0,<3.0.0",
    "mcp>=0.9.0",
    "fastmcp>=0.1.0",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

web = [
    "tavily-python>=0.3.0",
    "google-search-results>=2.4.0",
]

daemon = [
    "pywin32>=305; sys_platform == 'win32'",
    "cks>=0.1.0",
    "structlog>=24.0.0",
    "psutil>=5.9.0",
]

all = [
    "search-research[web,dev,daemon]",
]

[project.urls]
Homepage = "https://github.com/EndUser123/search-research"
Documentation = "https://github.com/EndUser123/search-research#readme"
Repository = "https://github.com/EndUser123/search-research"
Issues = "https://github.com/EndUser123/search-research/issues"
"Migration Guide" = "https://github.com/EndUser123/search-research/blob/main/MIGRATION.md"
"Deprecation Notice" = "https://github.com/EndUser123/search-research/blob/main/DEPRECATION.md"

[tool.setuptools]
packages = ["search_research", "search_research.contrib", "search_research.contrib.semantic_daemon"]
package-dir = {"search_research" = "core", "search_research.contrib" = "contrib"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-q",
    "--tb=short",
    "--timeout=30",
]
asyncio_mode = "auto"
norecursedirs = [
    ".venv",
    ".claude",
    "node_modules",
    "__pycache__",
    ".git",
    "*.jsonl",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[project.scripts]
search-research = "search_research.cli:_main_sync"
