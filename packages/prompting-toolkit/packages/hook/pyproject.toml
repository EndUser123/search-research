[project]
name = "prompt-hook"
version = "1.0.0"
description = "Real-time prompt enhancement for Claude Code with choice UI and multi-terminal support"
requires-python = ">=3.10"
dependencies = []

readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prompting_toolkit"]
include = ["prompting_toolkit/**", "README.md", "LICENSE"]
