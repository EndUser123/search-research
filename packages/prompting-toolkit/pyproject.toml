[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompting-toolkit"
version = "1.0.0"
description = "Comprehensive prompting ecosystem with real-time enhancement and advanced strategy library"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "your@email.com"},
]

dependencies = [
    "pytest>=7.0.0",
]

keywords = [
    "prompt-engineering",
    "llm",
    "prompt-optimization",
    "claude-code",
    "monorepo",
    "prompting-strategies",
    "genetic-algorithm",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/csf-dev/prompting-toolkit"
Repository = "https://github.com/csf-dev/prompting-toolkit"
Documentation = "https://prompting-toolkit.readthedocs.io"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["packages/hook/tests", "packages/framework/tests"]
pythonpath = ["packages/hook", "packages/framework/src"]
addopts = [
    "--cov=packages/hook/hook",
    "--cov=packages/framework/src",
    "--cov-report=term-missing",
]
