# Pre-commit hooks configuration for type safety
# Prevents return type / caller mismatch bugs via static analysis

repos:
  # Type checking with mypy - catches type mismatches BEFORE runtime
  - repo: local
    hooks:
      - id: mypy-hooks
        name: mypy (strict type checking)
        entry: mypy
        language: system
        types: [python]
        # Exclude tests and third-party code from strict checking
        exclude: ^(tests/|test_|__pycache__|\.mypy_cache/|build/|dist/)
        args:
          - --config-file=mypy.ini
          - --strict
          - --warn-return-any
          - --warn-unused-ignores
          - --no-implicit-optional
        # Always run, even on safe commits
        always_run: true

  # Basic syntax and import checking
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        name: flake8 (linting)
        types: [python]
        args:
          - --max-line-length=120
          - --extend-ignore=E203,E501,W503
        exclude: ^(tests/|test_)

  # Check for common Python security issues
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: bandit (security)
        types: [python]
        args: [-c, pyproject.toml]
        exclude: ^tests/
