[mypy]
# Strict type checking configuration to prevent return type / caller mismatch bugs
python_version = 3.14

# Disallow untyped definitions - forces explicit return types
disallow_untyped_defs = True

# Disallow incomplete return types - prevents "list" without generic param
disallow_untyped_calls = True

# Disallow returning Any from typed functions
disallow_any_generics = True

# Warn about missing return statements (empty returns)
warn_no_return = True

# Warn about unused return type ignores
warn_unused_ignores = True

# Warn about unreachable code
warn_unreachable = True

# Strict optional checking
strict_optional = True

# Show error codes for easier suppression when truly needed
show_error_codes = True

# Show column numbers in error messages
show_column_numbers = True

# Check untyped defs - ensures ALL functions have type hints
check_untyped_defs = True

# Disallow sublassing Any - prevents type information loss
disallow_subclassing_any = True

# Disallow implicit concatenation of strings from different types
disallow_any_explicit = True

# Enable strict equality checks
strict_equality = True

# Explicit error context in error messages
show_error_context = True

# Color output for better readability
color_output = True

# Error summary at end
error_summary = True

# Files to exclude from type checking (third-party, generated)
exclude = (?x)(
    ^build/
    | ^dist/
    | ^\.venv/
    | ^venv/
    | ^\.mypy_cache/
    | __pycache__/
    | \.pyc$
    )

# Per-module options for third-party code that doesn't have types
[mypy-jinja2.*]
ignore_missing_imports = True

[mypy-markdown.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True
