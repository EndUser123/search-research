# Validator Configuration v2
# Rules for Debug and RCA validation with synonyms, severity, and profiles.

version: 2

# Profiles define which rules apply to each validator
profiles:
  debug:
    inherit: debug_lite
  debug_lite:
    inherit: base_lite
    rules:
      - intent_activation_lite
      - telemetry_check
      - next_steps_lite
      - progress_report
      - reproduce_first_lite
      - hypothesis_ledger
      - invariant_check
      - tdd_test_first
  debug_strict:
    inherit: base
    rules:
      - intent_activation
      - telemetry_check
      - next_steps
      # New Protocol Rules
      - reproduce_first
      - hypothesis_ledger
      - execution_trace
      - invariant_check
      - progress_report
      - tdd_test_first
  rca:
    inherit: rca_lite
  rca_lite:
    inherit: base_lite
    rules:
      - mental_model_explicit_lite
      - specialist_handoff_lite
      - data_flow_trace_lite
      - hypothesis_ledger
      - five_whys
      - invariant_check
      - progress_report
  rca_strict:
    inherit: base
    rules:
      - mental_model_explicit
      - specialist_handoff
      # New Protocol Rules
      - data_flow_trace
      - hypothesis_ledger
      - five_whys
      - invariant_check
      - progress_report
  dne:
    inherit: base
    rules:
      - dne_classification
      - dne_findings
      - dne_action_items
      - dne_assessment
      - dne_git_state
  base:
    rules:
      - use_tool_citation
    # Closure Enforcers
      - concrete_recommendation
      - fix_verification
      - observe_before_act
      - scope_context
      - verified_via
      - root_question
  base_lite:
    rules:
      - use_tool_citation_lite
      - concrete_recommendation
      - fix_verification
      - observe_before_act_lite
      - scope_context
      - verified_via_lite
      - root_question_lite

# Rule definitions
rules:
  # ===== Base Rules (shared by debug and rca) =====

  use_tool_citation:
    name: "Tool Citation"
    severity: error
    description: "Claims must be backed by tool citations."
    triggers:
      - "root cause"
      - "diagnosis"
      - "cause:"
      - "identified issue"
      - "primary cause"
    requires_any:
      - pattern: "\\[.*?:.*?\\]"
        type: regex
        description: "Bracket citation like [file:line]"
      - pattern: "[\\w\\/\\.]+\\.py:\\d+"
        type: regex
        description: "Python path citation like src/main.py:42"
    message: "You claimed a Root Cause but provided NO tool citation. Use [file:line] or [log:time] format."

  use_tool_citation_lite:
    name: "Tool Citation (Lite)"
    severity: warning
    description: "Claims should be backed by tool citations."
    triggers:
      - "root cause"
      - "diagnosis"
      - "cause:"
      - "identified issue"
      - "primary cause"
    requires_any:
      - pattern: "\\[.*?:.*?\\]"
        type: regex
        description: "Bracket citation like [file:line]"
      - pattern: "[\\w\\/\\.]+\\.py:\\d+"
        type: regex
        description: "Python path citation like src/main.py:42"
    message: "Recommend adding a tool citation for diagnosis claims (e.g., [file:line])."



  observe_before_act:
    name: "Observe Before Act"
    severity: error
    description: "Must observe the environment before proposing actions."
    triggers:
      - "action:"
      - "my action:"
      - "proposed action"
    requires_before:
      patterns:
        - "observed:"
        - "observations:"
        - "what i checked:"
        - "i looked at:"
        - "i verified:"
        - "first, i checked"
    message: "You proposed an Action without stating what you Observed first."

  observe_before_act_lite:
    name: "Observe Before Act (Lite)"
    severity: warning
    description: "Prefer observing the environment before proposing actions."
    triggers:
      - "action:"
      - "my action:"
      - "proposed action"
    requires_before:
      patterns:
        - "observed:"
        - "observations:"
        - "what i checked:"
        - "i looked at:"
        - "i verified:"
        - "first, i checked"
    message: "Recommend stating observations before proposing an action."

  # ------------------------------------------------------------------
  # CLOSURE ENFORCERS (Output Completeness)
  # ------------------------------------------------------------------
  # Rule: Diagnosis must lead to Action
  concrete_recommendation:
    triggers:
      - "root cause"
      - "diagnosis"
      - "issue identified"
    requires_one_of:
      - "recommendation[:\\s]"
      - "recommended fix"
      - "action plan"
      - "next steps"
      - "proposed solution"
    severity: warning
    message: "ΓÜá∩╕Å [Incomplete Diagnosis]: You identified a Root Cause/Diagnosis but provided no concrete Recommendation. Always close the loop with 'Recommendation:' or 'Next Steps:'."

  # Rule: Fix must be Verified
  fix_verification:
    triggers:
      - "fixed"
      - "corrected"
      - "resolved"
      - "applied fix"
      - "patch applied"
    requires_one_of:
      - "verified"
      - "verify"
      - "checked"
      - "validation"
      - "confirmed"
      - "testing"
      - "grep"
    severity: warning
    message: "ΓÜá∩╕Å [Incomplete Fix]: You claimed a fix but didn't mention verification. Always prove it with 'Verified:' or 'Validation:'."

  # ------------------------------------------------------------------
  # BASE RULES (Universal)
  # ------------------------------------------------------------------
  scope_context:
    name: "Scope Context"
    severity: warning # Warning, not error
    description: "Context sections should clarify scope."
    triggers:
      - "context:"
    requires_any:
      - pattern: "worktree"
        type: literal
      - pattern: "global"
        type: literal
      - pattern: "local"
        type: literal
      - pattern: "project"
        type: literal
      - pattern: "workspace"
        type: literal
    message: "Context section lacks scope clarity (worktree/global/local)."

  verified_via:
    name: "Verified Via"
    severity: error
    description: "Verification claims must cite the tool used."
    triggers:
      - "verified"
      - "i verified"
      - "confirmed"
    requires_any:
      - pattern: "verified via"
        type: literal
      - pattern: "verified using"
        type: literal
      - pattern: "verified with"
        type: literal
      - pattern: "checked via"
        type: literal
      - pattern: "confirmed via"
        type: literal
      - pattern: "tested with"
        type: literal
    message: "You claimed to verify but didn't cite HOW. Use 'Verified via: [tool]' format."

  verified_via_lite:
    name: "Verified Via (Lite)"
    severity: warning
    description: "Verification claims should cite the tool used."
    triggers:
      - "verified"
      - "i verified"
      - "confirmed"
    requires_any:
      - pattern: "verified via"
        type: literal
      - pattern: "verified using"
        type: literal
      - pattern: "verified with"
        type: literal
      - pattern: "checked via"
        type: literal
      - pattern: "confirmed via"
        type: literal
      - pattern: "tested with"
        type: literal
    message: "Recommend adding 'Verified via: [tool]' for verification claims."

  root_question:
    name: "Root Question"
    severity: error
    description: "Fixes must be preceded by asking WHY."
    triggers:
      - "fix:"
      - "solution:"
      - "proposed fix"
      - "recommend"
    requires_any:
      - pattern: "root question"
        type: literal
      - pattern: "why is"
        type: literal
      - pattern: "why did"
        type: literal
      - pattern: "why does"
        type: literal
      - pattern: "why was"
        type: literal
    message: "You proposed a fix without asking WHY the problem exists."

  root_question_lite:
    name: "Root Question (Lite)"
    severity: warning
    description: "Fixes should be preceded by asking WHY."
    triggers:
      - "fix:"
      - "solution:"
      - "proposed fix"
      - "recommend"
    requires_any:
      - pattern: "root question"
        type: literal
      - pattern: "why is"
        type: literal
      - pattern: "why did"
        type: literal
      - pattern: "why does"
        type: literal
      - pattern: "why was"
        type: literal
    message: "Recommend adding a root question before proposing a fix."

  # ===== Debug-specific Rules =====

  intent_activation_lite:
    name: "Intent Activation (Lite)"
    severity: warning
    description: "Debug should state which mode is being activated."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "ACTIVATING .* (MODE|DEBUGGING)"
        type: regex
    message: "Recommend stating which mode is being activated (e.g., ACTIVATING SYSTEMATIC DEBUGGING)."

  next_steps_lite:
    name: "Next Steps (Lite)"
    severity: warning
    description: "Debug output should include next steps."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "next steps"
        type: literal
      - pattern: "## next"
        type: literal
    message: "Recommend adding a 'Next Steps' section."

  reproduce_first_lite:
    name: "Reproduce First (Lite)"
    severity: warning
    description: "Prefer reproducing bug before fixing."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "🔴 REPRODUCING:"
        type: literal
      - pattern: "✅ BUG CONFIRMED:"
        type: literal
      - pattern: "reproducing:"
        type: literal
      - pattern: "bug confirmed"
        type: literal
    message: "Recommend reproducing the bug before fixing."

  intent_activation:
    name: "Intent Activation"
    severity: error
    description: "Debug must declare which mode is being activated."
    triggers: [] # Always checked
    always_check: true
    requires_any:
      - pattern: "ACTIVATING .* (MODE|DEBUGGING)"
        type: regex
    message: "Debug output must state which mode is being activated (e.g., ACTIVATING SYSTEMATIC DEBUGGING)."

  telemetry_check:
    name: "Telemetry Check"
    severity: warning
    description: "If telemetry section exists, it must have content."
    triggers:
      - "telemetry data"
    requires_any:
      - pattern: "total events:"
        type: literal
    message: "Telemetry section found but appears empty."

  next_steps:
    name: "Next Steps"
    severity: error
    description: "Debug output must include next steps."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "next steps"
        type: literal
      - pattern: "## next"
        type: literal
    message: "Debug output must include a 'Next Steps' section."

  # ===== RCA-specific Rules =====

  mental_model_explicit_lite:
    name: "Mental Models (Lite)"
    severity: warning
    description: "RCA should select and display mental models."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "selected mental models"
        type: literal
      - pattern: "enhancementrouter not found"
        type: literal
    message: "Recommend selecting and displaying Mental Models."

  specialist_handoff_lite:
    name: "Specialist Handoff (Lite)"
    severity: warning
    description: "RCA should invoke specialist or enhancements."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "invoking rca-specialist"
        type: literal
      - pattern: "task\\(subagent_type=\"rca-specialist\""
        type: regex
      - pattern: "rca handoff bundle"
        type: literal
      - pattern: "executing rca enhancements"
        type: literal
    message: "Recommend invoking specialist or enhancements for full RCA workflow."

  data_flow_trace_lite:
    name: "Data Flow Trace (Lite)"
    severity: warning
    description: "RCA should trace data flow to failure point."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "🔍 TRACING DATA FLOW:"
        type: literal
      - pattern: "tracing data flow"
        type: literal
      - pattern: "→ Input:"
        type: literal
    message: "Recommend adding a data flow trace to isolate failure."

  mental_model_explicit:
    name: "Mental Models"
    severity: error
    description: "RCA must select and display mental models."
    triggers: [] # Always checked
    always_check: true
    requires_any:
      - pattern: "selected mental models"
        type: literal
      - pattern: "enhancementrouter not found"
        type: literal
    message: "RCA must select and display Mental Models."

  specialist_handoff:
    name: "Specialist Handoff"
    severity: error
    description: "RCA must invoke specialist or enhancements."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "invoking rca-specialist"
        type: literal
      - pattern: "task\\(subagent_type=\"rca-specialist\""
        type: regex
      - pattern: "rca handoff bundle"
        type: literal
      - pattern: "executing rca enhancements"
        type: literal
    message: "RCA output incomplete. Must invoke specialist or enhancements."

  # ===== New Protocol Rules (Effectiveness-First) =====

  reproduce_first:
    name: "Reproduce First"
    severity: error
    description: "Must reproduce bug before fixing."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "🔴 REPRODUCING:"
        type: literal
      - pattern: "✅ BUG CONFIRMED:"
        type: literal
      - pattern: "reproducing:"
        type: literal
      - pattern: "bug confirmed"
        type: literal
    message: "You must REPRODUCE the bug before fixing. Add '🔴 REPRODUCING:' and '✅ BUG CONFIRMED:' sections."

  hypothesis_ledger:
    name: "Hypothesis Ledger"
    severity: warning
    description: "Track hypotheses to avoid re-testing."
    triggers:
      - "hypothesis"
      - "theory"
      - "might be"
      - "could be"
    requires_any:
      - pattern: "## Hypothesis Ledger"
        type: literal
      - pattern: "| # | Hypothesis |"
        type: literal
    message: "You're forming hypotheses without tracking them. Add a '## Hypothesis Ledger' table."

  execution_trace:
    name: "Execution Trace"
    severity: error
    description: "Must trace execution before hypothesizing."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "🔍 TRACING:"
        type: literal
      - pattern: "tracing:"
        type: literal
      - pattern: "→ Line"
        type: literal
    message: "You must mentally TRACE execution before forming hypotheses. Add '🔍 TRACING: [function]' section."

  data_flow_trace:
    name: "Data Flow Trace"
    severity: error
    description: "RCA must trace data flow to failure point."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "🔍 TRACING DATA FLOW:"
        type: literal
      - pattern: "tracing data flow"
        type: literal
      - pattern: "→ Input:"
        type: literal
    message: "RCA must trace data flow to isolate failure. Add '🔍 TRACING DATA FLOW:' section."

  invariant_check:
    name: "Invariant Check"
    severity: warning
    description: "Should state and verify invariants."
    triggers:
      - "unexpected"
      - "should be"
      - "expected"
    requires_any:
      - pattern: "📋 INVARIANTS:"
        type: literal
      - pattern: "invariants:"
        type: literal
      - pattern: "❌ VIOLATED:"
        type: literal
    message: "State expected invariants and check if violated. Add '📋 INVARIANTS:' section."

  progress_report:
    name: "Progress Report"
    severity: warning
    description: "Show what's been tried and what's next."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "## Debug Progress"
        type: literal
      - pattern: "## RCA Progress"
        type: literal
      - pattern: "- ✅"
        type: literal
      - pattern: "- 🔄"
        type: literal
    message: "Include a progress report showing tried/next steps. Add '## Debug Progress' section."

  tdd_test_first:
    name: "TDD Test First"
    severity: warning
    description: "Write failing test before fix."
    triggers:
      - "fix:"
      - "fixing"
      - "patch"
    requires_any:
      - pattern: "def test_"
        type: literal
      - pattern: "test that fails"
        type: literal
      - pattern: "failing test"
        type: literal
    message: "Write a failing test BEFORE attempting fix. Show 'def test_bug_reproduction()' or similar."

  five_whys:
    name: "5 Whys Analysis"
    severity: warning
    description: "RCA should apply iterative why analysis."
    triggers:
      - "root cause"
      - "cause:"
    requires_any:
      - pattern: "❓ Why"
        type: literal
      - pattern: "🎯 ROOT CAUSE:"
        type: literal
      - pattern: "why did"
        type: literal
    message: "Apply 5 Whys analysis to find root cause. Add '❓ Why...' chain."

  # ===== DNE-specific Rules =====

  dne_classification:
    name: "Classification"
    severity: error
    description: "DUF-NSE must state change classification."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "**Classification:**"
        type: literal
      - pattern: "Classification:"
        type: literal
    message: "Missing Classification. Add '**Classification:** [Trivial/Moderate/Significant/Major]'."

  dne_findings:
    name: "Findings Section"
    severity: error
    description: "DUF-NSE must include pre-mortem findings."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "### Findings"
        type: literal
      - pattern: "## Findings"
        type: literal
      - pattern: "Pre-mortem:"
        type: literal
    message: "Missing Findings section. Add '### Findings' with pre-mortem checks."

  dne_action_items:
    name: "Action Items"
    severity: error
    description: "DUF-NSE must include grouped action items."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "### Action Items"
        type: literal
      - pattern: "🔴 Priority"
        type: literal
      - pattern: "**1** -"
        type: literal
    message: "Missing Action Items section. Add '### Action Items' with grouped tasks."

  dne_assessment:
    name: "Assessment"
    severity: error
    description: "DUF-NSE must include overall assessment."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "### Assessment"
        type: literal
      - pattern: "Safe to proceed"
        type: literal
      - pattern: "Needs review"
        type: literal
      - pattern: "High risk"
        type: literal
    message: "Missing Assessment. Add '### Assessment' with risk level."

  dne_git_state:
    name: "Git State"
    severity: warning
    description: "DUF-NSE should report git state."
    triggers: []
    always_check: true
    requires_any:
      - pattern: "### Git State"
        type: literal
      - pattern: "Git State"
        type: literal
      - pattern: "unpushed commits"
        type: literal
      - pattern: "working tree clean"
        type: literal
    message: "Missing Git State. Add '### Git State' section."


