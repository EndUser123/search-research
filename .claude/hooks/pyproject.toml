[tool.ruff]
# Enforce subprocess.run timeout in test files
# This prevents tests from hanging indefinitely when subprocess.run()
# is called without a timeout parameter - a critical issue on Windows 11

line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["S"]  # Security rules
ignore = ["S603"]  # We'll handle S603 per-file instead

[tool.ruff.lint.per-file-ignores]
# ENFORCE subprocess.run timeout in test files
# Any subprocess.run() call in test files without timeout parameter will trigger an error
"tests/**/*.py" = []  # Remove S603 from ignore list for test files

# You can also enable other security rules as needed
# "tests/**/*.py" = ["S101", "S103"]  # Example: assert usage, permissions check

[tool.ruff.lint.per-file-include]
# Only apply S603 to test files
"tests/**/*.py" = ["S603"]
