[project]
name = "claude-code-hooks"
version = "1.0.0"
description = "Hook scripts for Claude Code with disler observability"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
# uv will auto-create and manage virtual environment

[tool.ruff]
# Enable ruff to check for commonly unused imports, but allow explicit noqa
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = [
    "E501",  # Line too long - handled by formatter
    "B008",  # Do not perform function calls in argument defaults - common in dataclasses
]

# Allow certain imports to be marked as unused when they're used in ways
# ruff can't detect (e.g., dynamic imports, used in type annotations, etc.)
[tool.ruff.lint.per-file-ignores]
# Example: "lib/plan_visualizer.py" = ["F401"]  # os is used but ruff can't detect it

[tool.pytest.ini_options]
# Disable problematic plugins that cause tests to hang
# pytest-testmon: Known to cause hangs in Claude Code workflows
# See: pytest_stuck_prevention.md in memory
addopts = "-p no:testmon -p no:pytest-testmon"
