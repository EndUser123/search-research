model_list:
  # OpenRouter - Stable, Tool-Capable Models Only
  - model_name: openrouter/deepseek-ai/deepseek-v3-0324
    litellm_params:
      model: openrouter/deepseek-ai/deepseek-v3-0324
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter/kwaipilot/kat-coder-pro
    litellm_params:
      model: openrouter/kwaipilot/kat-coder-pro
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter/amazon/nova-2-lite-v1
    litellm_params:
      model: openrouter/amazon/nova-2-lite-v1
      api_key: os.environ/OPENROUTER_API_KEY

router:
  router_type: simple_shuffle

environment_variables:
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
