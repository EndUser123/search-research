model_list:
  # GLM via Z.AI for Droid
  - model_name: glm-4.6-droid
    litellm_params:
      model: glm-4.6
      api_base: https://api.z.ai/api/anthropic
      api_key: os.environ/ZAI_API_KEY

  # OpenRouter - Droid-safe models
  - model_name: openrouter/deepseek-ai/deepseek-v3-0324
    litellm_params:
      model: openrouter/deepseek-ai/deepseek-v3-0324
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter/amazon/nova-2-lite-v1
    litellm_params:
      model: openrouter/amazon/nova-2-lite-v1
      api_key: os.environ/OPENROUTER_API_KEY

router:
  router_type: simple_shuffle

environment_variables:
  ZAI_API_KEY: ${ZAI_API_KEY}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
