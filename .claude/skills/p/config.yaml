# Code Maturation Pipeline - Quality Gate Configuration
# Configurable thresholds for each phase of the pipeline

schema_version: 1

pipeline:
  name: "Code Maturation Pipeline"
  version: "1.0.0"
  description: "4-phase pipeline: Build → Review → Validate → Publish"

# Quality gate thresholds
targets:
  # Code Coverage
  coverage:
    # Minimum coverage for new/changed code
    new_code_threshold: 85
    # Minimum coverage for entire project
    project_threshold: 70
    # Lines to exclude from coverage calculation
    exclude_patterns:
      - "*/tests/*"
      - "*/test_*.py"
      - "*/__pycache__/*"
      - "*/site-packages/*"

  # Cyclomatic Complexity (McCabe)
  cyclomatic:
    # Maximum complexity for new code
    new_code_max: 10
    # Maximum complexity for existing code (higher for gradual improvement)
    existing_code_max: 15
    # Tools: radon, pylint

  # Cognitive Complexity
  cognitive:
    # Maximum cognitive complexity for new code
    new_code_max: 15
    # Maximum for existing code
    existing_code_max: 20
    # Tools: pylint (flake8-cognitive-complexity)

  # Code Quality
  quality:
    # Minimum pylint score (0-10)
    pylint_score_min: 7.0
    # Maximum radon mi (Maintainability Index) categories allowed
    # Options: A, B, C, D, F (A is best)
    max_mi_category: "C"

  # Code Duplication
  duplication:
    # Maximum duplication percentage for new code
    new_code_max_percent: 3
    # Maximum for entire project
    project_max_percent: 5
    # Minimum tokens to consider as duplication
    min_tokens: 50

  # Test Requirements
  tests:
    # Minimum test to code ratio (lines of tests / lines of code)
    min_test_ratio: 0.3
    # Require unit tests for all public functions
    require_public_function_tests: true
    # Require integration tests for modules
    require_integration_tests: true

  # Security
  security:
    # Maximum allowed severity (block if higher found)
    # Options: LOW, MEDIUM, HIGH, CRITICAL
    max_allowed_severity: "MEDIUM"
    # Tools: bandit
    bandit_confidence: "medium"

  # Secrets Detection
  secrets:
    # Block if secrets found in code
    block_on_secrets: true
    # Patterns to scan for (basic set - extend as needed)
    patterns:
      - "api[_-]?key"
      - "secret[_-]?key"
      - "password"
      - "token"
      - "credential"
      - "private[_-]?key"

  # Documentation
  docs:
    # Require docstrings for public functions
    require_function_docstrings: true
    # Require module docstrings
    require_module_docstrings: true
    # Minimum docstring coverage
    min_docstring_coverage: 80

  # Dependency Security
  dependencies:
    # Block if vulnerabilities found
    block_on_vulnerabilities: true
    # Maximum severity allowed (pip-audit)
    max_allowed_severity: "MEDIUM"
    # Check for outdated dependencies
    check_outdated: false

  # Type Checking
  type_checking:
    # Require type hints for public functions
    require_public_hints: true
    # Strict mypy mode
    mypy_strict: false

# Tools used for validation
tools:
  pytest:
    enabled: true
    command: "pytest"
    args: ["-v", "--tb=short", "--cov=.", "--cov-report=term-missing"]

  pytest_cov:
    enabled: true
    command: "pytest-cov"
    args: []

  radon:
    enabled: true
    command: "radon"
    # cc for cyclomatic complexity, mi for maintainability index
    complexity_command: "radon cc"
    maintainability_command: "radon mi"

  pylint:
    enabled: true
    command: "pylint"
    args: ["--output-format=text"]

  flake8_cognitive_complexity:
    enabled: true
    command: "flake8"
    args: ["--select=C901"]

  bandit:
    enabled: true
    command: "bandit"
    args: ["-r", ".", "-f", "json"]

  ruff:
    enabled: true
    command: "ruff"
    args: ["check", "."]

  mypy:
    enabled: true
    command: "mypy"
    args: ["."]

  pip_audit:
    enabled: true
    command: "pip-audit"
    args: []

# Phase-specific overrides
phases:
  P1:  # Build
    focus:
      - tests
      - coverage
    # Relaxed thresholds during build phase
    coverage:
      new_code_threshold: 70  # Lower requirement during initial build

  P2:  # Review
    focus:
      - quality
      - complexity
      - duplication
    enabled_tools:
      - pylint
      - radon
      - ruff

  P3:  # Validate
    focus:
      - security
      - tests
      - dependencies
    enabled_tools:
      - pytest
      - bandit
      - pip_audit
      - mypy

  P4:  # Publish
    focus:
      - docs
      - secrets
    enabled_tools:
      - all

# Adaptive depth settings
profiles:
  # Quick mode - for local iteration
  quick:
    enabled_tools:
      - pytest
      - ruff
    skip:
      - pip_audit
      - mypy

  # Standard mode - default
  standard:
    enabled_tools:
      - all

  # Full mode - for release branches
  full:
    enabled_tools:
      - all
    additional_checks:
      - integration_tests
      - e2e_tests
      - performance_tests
