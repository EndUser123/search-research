# Intent Validation + Auto-Backup Configuration
#
# This file configures the two-layer safety system:
# Layer 1 (Prevention): Intent validation - blocks destructive operations without user intent
# Layer 2 (Recovery): Auto-backup - creates git commits after destructive operations

# =============================================================================
# INTENT VALIDATION CONFIGURATION
# =============================================================================

[intent_validation]
# Enable/disable the entire intent validation system
# Set to false to disable all intent validation checks
enabled = true

# Confidence thresholds (0-100)
# Confidence < block_threshold    => BLOCK operation
# Confidence in [block, prompt]   => PROMPT user for confirmation
# Confidence >= prompt_threshold   => ALLOW operation
block_threshold = 40
prompt_threshold = 70

# Transcript search scope
# How many recent user messages to analyze for intent signals
# Higher = more context, but slower. Lower = faster, but may miss intent.
message_count = 5

# Debug logging (verbose stderr output)
# Set to true to see confidence scores, signals found, and decisions
debug_mode = false

# Special handling for merge conflicts
# If git is in merge conflict state, destructive operations require
# additional evidence. This grace value is subtracted from confidence
# when conflicts are detected (prevents "resolve conflict" from allowing reset).
merge_conflict_grace = 20

# =============================================================================
# AUTO-BACKUP CONFIGURATION
# =============================================================================

[auto_backup]
# Enable/disable automatic git commits after destructive operations
# When enabled, every successful destructive operation creates a recovery point
# Disable if auto-backup commits are too noisy (recovery still possible via git reflog)
enabled = true

# Prefix for auto-backup commit messages
# Commits will be named: "auto-backup: {tool_name} {timestamp}"
commit_message_prefix = "auto-backup"

# =============================================================================
# DESTRUCTIVE OPERATION CLASSIFICATION
# =============================================================================

# Patterns for classifying destructive operations by severity level
# Used to determine how dangerous an operation is before checking user intent

[operation_severity]
# Critical severity: Irreversible or highly destructive operations
# These require explicit user authorization (70%+ confidence)
critical = [
    "rm -rf",           # Recursive force delete
    "rm -r",            # Recursive delete
    "git reset --hard", # Hard reset (loses all uncommitted changes)
    "git clean -fdx",    # Clean untracked files and directories
    "git clean -fd",     # Clean untracked files and directories
    "git push --force",  # Force push (rewrites remote history)
    "git push -f",       # Force push (short form)
    "dd if=",           # Direct disk write (data destroyer)
    "shred ",           # Secure delete (unrecoverable)
    "git branch -D",    # Delete branch (even if not merged)
    "DROP DATABASE",     # SQL: Drop entire database
    "TRUNCATE",         # SQL: Truncate table (wipe all rows)
]

# High severity: Destructive but potentially recoverable operations
# These require at least partial user intent (40-70% confidence)
high = [
    "rm ",              # Any rm command (delete files)
    "del ",             # Windows delete command
    "rmdir ",           # Remove directory
    "git reset",        # Git reset (any form)
    "git rebase --abort", # Abort rebase (loses commits)
    "> ",               # Shell redirection to file (truncate)
    "tee /dev/null",    # Discard output (potential data loss)
    "DELETE FROM",      # SQL: DELETE without WHERE clause (all rows)
]

# Medium severity: Potentially destructive operations
# These have lower threshold but still require some intent evidence
medium = [
    ">> ",              # Append to file (could overwrite if redirected)
    "sed",             # Stream editor (can delete lines)
]

# =============================================================================
# USER INTENT SIGNAL KEYWORDS
# =============================================================================

# Keywords used to detect if user is requesting, approving, or canceling
# destructive operations. All matching is case-insensitive.

[destructive_signals]
# Explicit: User clearly wants to destroy something
# These are strong signals of destructive intent
explicit = [
    "delete", "remove", "erase", "overwrite", "wipe", "clear",
    "destroy", "nuke", "start over", "begin from scratch",
    "clean up", "cleanup", "discard", "throw away", "tear down",
    "reset", "revert", "rollback", "obliterate", "annihilate",
    "strip", "purge",
]

# Approval: User confirms after being warned or asked
# These indicate user authorization, but should be combined with
# other signals for strongest confidence
approval = [
    "yes", "proceed", "confirmed", "go ahead", "do it",
    "approve", "understood", "fine", "ok", "okay", "alright", "right",
    "correct", "confirmed", "authorized", "execute", "implement",
    "make it happen", "let's do it", "go for it",
]

# Context: User implies intent from prior conversation
# These are weak signals and should be combined with other evidence
context = [
    "i asked you to", "remember when", "as i said", "as said",
    "of course", "obviously", "naturally", "clearly",
]

# Negative: User cancels or overrides previous request
# These signals OVERRIDE all other intent signals (cancel trumps delete)
negative = [
    "cancel", "stop", "abort", "no", "wait",
    "never mind", "hold on", "scratch that",
    "on second thought", "forget it", "ignore that",
    "don't do it", "don't proceed", "don't delete",
]

# =============================================================================
# ENVIRONMENT VARIABLE OVERRIDES
# =============================================================================

# For one-off changes without editing this file, set environment variables:
#
# Disable intent validation:
#   export INTENT_VALIDATION_ENABLED="false"
#
# Change thresholds:
#   export INTENT_VALIDATION_BLOCK_THRESHOLD="50"
#   export INTENT_VALIDATION_PROMPT_THRESHOLD="80"
#
# Enable debug logging:
#   export INTENT_VALIDATION_DEBUG_MODE="true"
#
# Disable auto-backup:
#   export AUTO_BACKUP_ENABLED="false"
