# Commands Registry for Next Action Suggester System
# Maps signals to suggested follow-up commands

[commands]
[commands.task_unresolved]
aliases = ["/task-unresolved", "task-unresolved"]
description = "Scan chat history for unresolved issues and propose task candidates"

[signals]
# Signal: fix_applied → Suggest: /commit
# When a fix is applied, suggest committing the changes
fix_applied = "/commit - Commit applied fix"

# Signal: tests_passing → Suggest: /commit
# When tests pass, suggest committing the working code
tests_passing = "/commit - Commit passing tests"

# Signal: tests_failing → Suggest: /debug
# When tests fail, suggest debugging
tests_failing = "/debug - Debug failing tests"

# Signal: unresolved_items_detected → Suggest: /task-unresolved
# When unresolved backlog hints appear, suggest focused unresolved scan
unresolved_items_detected = "/task-unresolved - Scan unresolved items from chat history"
